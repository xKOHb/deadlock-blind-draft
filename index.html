    ${res ? html`<div className="grid gap-4 md:grid-cols-3">${RL_LV.map(l => html`<div key=${l.k} className="panel p-4 rl-col" style=${{'--c':l.col}}>
      <div className="rl-h" style=${{color:l.col}}>${l.name} <span className="muted num" style=${{fontSize:'13px'}}>· ${res[l.k].length}</span></div>
      <div className="muted" style=${{fontSize:'12px',marginBottom:'10px'}}>${l.k === 'low' && n === RL_MIN ? 'Добор до минимума в 3 героя' : l.sub}</div>

function bgClick(e){
  if (document.body.classList.contains('no-anim') || e.button > 0) return;
  const t = e.target; if (!t || !t.closest || t.closest('button,a,input,select,textarea,label,.panel,.card,.htile,.modal-bg,.tip,[role=dialog],[data-tip],.toast')) return;
  const now = Date.now(); if (now - bgLast < 90) return; bgLast = now;
  const f = BG_FX[document.documentElement.getAttribute('data-theme') || 'gold'] || BG_FX.gold;
  f(e.clientX, e.clientY); Sfx.play('tick');
}
function installEggs(){
  let seq = [], word = '', logo = {n:0, t:0}, rainbow = false;
  const typing = e => { const t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable); };
  const key = e => {
    if (typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
    seq.push(e.key.length === 1 ? e.key.toLowerCase() : e.key); if (seq.length > KONAMI.length) seq.shift();
    if (seq.length === KONAMI.length && seq.every((k, i) => k === KONAMI[i]) && !rainbow){
      seq = []; rainbow = true;
      const root = document.documentElement, prev = root.getAttribute('data-theme') || 'gold'; let i = 0;
      Fx.toast('Режим дискотеки'); Fx.rain(120); Sfx.play('spark');
      const iv = setInterval(() => { root.setAttribute('data-theme', THEMES[i++ % THEMES.length].id); }, 260);
      setTimeout(() => { clearInterval(iv); root.setAttribute('data-theme', prev); rainbow = false; }, 3400);
    }
    if (e.key.length === 1){
      word = (word + e.key.toLowerCase()).slice(-10);
      for (const w in EGG_WORDS){ if (word.endsWith(w)){ word = ''; EGG_WORDS[w](); break; } }
    }
  };
  const click = e => {
    const b = e.target.closest && e.target.closest('.brand'); if (!b) return;
    const now = Date.now(); logo.n = now - logo.t < 1500 ? logo.n + 1 : 1; logo.t = now;
    if (logo.n >= 7){ logo.n = 0; Fx.toast('Ты нашёл тайный кристалл'); Fx.rain(40); Sfx.play('spark'); }
  };
  let title = document.title;
  const vis = () => { if (document.hidden){ title = document.title; document.title = 'Вернись, души ещё ждут…'; } else document.title = title; };
  const move = e => { const c = e.target.closest && e.target.closest('.hub-card'); if (!c) return; const r = c.getBoundingClientRect(); const z = tipZoom(); c.style.setProperty('--mx', ((e.clientX - r.left) / z) + 'px'); c.style.setProperty('--my', ((e.clientY - r.top) / z) + 'px'); };
  window.addEventListener('keydown', key); document.addEventListener('click', click, true); document.addEventListener('visibilitychange', vis); document.addEventListener('pointermove', move, {passive:true}); document.addEventListener('pointerdown', bgClick);
  if (!store.get('bd_bghint', false)) setTimeout(() => { Fx.toast('Фон кликабельный: попробуй нажать на пустое место'); store.set('bd_bghint', true); }, 7000);
  try { console.log('%cDeadlock Minigames', 'font:700 18px Georgia;color:#e0c58a', '\nИщешь секреты? Попробуй старый добрый код Konami.'); } catch (e){}
  return () => { window.removeEventListener('keydown', key); document.removeEventListener('click', click, true); document.removeEventListener('visibilitychange', vis); document.removeEventListener('pointermove', move); document.removeEventListener('pointerdown', bgClick); };
}
let LAST_THEME = null;
function App(){
  const [prefs, setPrefsS] = useState(() => ({...PREF_DEF, ...store.get('bd_prefs2', {})}));
  const setPrefs = p => { setPrefsS(p); store.set('bd_prefs2', p); };
  const [showSet, setShowSet] = useState(false), [showRules, setShowRules] = useState(false);
  useEffect(() => { if (prefs.musicOn) Music.play(prefs.track, prefs.vol); else Music.stop(); }, [prefs.musicOn, prefs.track]);
  useEffect(() => { Music.vol(prefs.vol); }, [prefs.vol]);
  useEffect(() => {
    if (!prefs.musicOn) return;
    const h = () => Music.play(prefs.track, prefs.vol);
    window.addEventListener('pointerdown', h, {once:true});
    return () => window.removeEventListener('pointerdown', h);
  }, [prefs.musicOn, prefs.track]);
  useEffect(() => { document.body.classList.toggle('no-anim', prefs.anim === false); }, [prefs.anim]);
  useEffect(() => { Sfx.setOn(prefs.sfx !== false); }, [prefs.sfx]);
  useEffect(() => {
    const id = THEMES.some(t => t.id === prefs.theme) ? prefs.theme : 'gold', root = document.documentElement;
    if (LAST_THEME !== null && LAST_THEME !== id && !document.body.classList.contains('no-anim')){   // плавная смена темы: старый фон растворяется
      const cs = getComputedStyle(document.body), ov = document.createElement('div');
      ov.className = 'theme-ov'; ov.style.backgroundColor = cs.backgroundColor; ov.style.backgroundImage = cs.backgroundImage; ov.style.backgroundSize = cs.backgroundSize; ov.style.backgroundPosition = cs.backgroundPosition;
      document.body.appendChild(ov); setTimeout(() => ov.remove(), 800);
    }
    LAST_THEME = id; root.setAttribute('data-theme', id); Sfx.setTheme(id);
    const mt = document.querySelector('meta[name="theme-color"]'); if (mt) mt.setAttribute('content', getComputedStyle(root).getPropertyValue('--bg').trim() || '#141311');
  }, [prefs.theme]);
  useEffect(() => installEggs(), []);
  useEffect(() => { const h = e => { if (e.target.closest && e.target.closest('.card:not(.banned)')) Sfx.play('tick'); }; document.addEventListener('click', h, true); return () => document.removeEventListener('click', h, true); }, []);
  const [conn, setConn] = useState('online');
  const [cfg, setCfg] = useState({rounds:8, mode:'balance', order:'ramp', hm:'same'});
  const [names, setNames] = useState({A:'Игрок А', B:'Игрок Б'});
  const [roomCode0] = useState(() => store.get('bd_room', null));
  const [game, setGame] = useState(() => gameFromHash(location.hash) || (roomCode0 ? 'draft' : null));
  useEffect(() => { const h = () => setGame(gameFromHash(location.hash)); window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h); }, []);
  const openGame = g => { location.hash = g ? '#' + g : ''; setGame(g); };
  const [localRun, setLocalRun] = useState(null);
  const [roomCode, setRoomCode] = useState(() => store.get('bd_room', null));
  const [dbh] = useState(() => ({status:fbDb ? 'ready' : 'off', db:fbDb, uid:getUid(), canWrite:true}));
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [cat, setCat] = useState({status:'loading'});
  const loadCat = useCallback(async () => {
    setCat({status:'loading'});
    try {
      const items = await loadCatalog();
      setCatalog(items); store.set('bd_catalog', {v:3, t:Date.now(), items});
      setCat({status:'ready', stale:false});
    } catch (e){
      const c0 = store.get('bd_catalog', null), c = c0 && c0.v === 3 ? c0 : null;       // API лежит, но есть копия с прошлого раза
      if (c && Array.isArray(c.items) && c.items.length >= 24){ setCatalog(c.items); setCat({status:'ready', stale:true, t:c.t}); }
      else setCat({status:'error', err:(e && e.message) || 'Неизвестная ошибка'});
    }
  }, []);
  useEffect(() => { loadCat(); }, []);

  useEffect(() => { if (dbh.status === 'ready' && roomCode) setConn('online'); }, [dbh.status]);

  const leaveRoom = () => { store.set('bd_room', null); setRoomCode(null); setError(null); };
  const create = async name => {
    setBusy(true); setError(null);
    try { const c = await createRoom(dbh.db, dbh.uid, name, cfg); store.set('bd_room', c); setRoomCode(c); }
    catch(e){ setError((e && e.message) || 'Не удалось создать комнату'); }
    setBusy(false);
  };
  const join = async (code, name) => {
    setBusy(true); setError(null);
    try { const c = await joinRoom(dbh.db, dbh.uid, code, name); store.set('bd_room', c); setRoomCode(c); }
    catch(e){ setError((e && e.message) || 'Не удалось войти в комнату'); }
    setBusy(false);
  };

  let body;
  if (!game) body = html`<${Hub} onOpen=${openGame}/>`;
  else if (cat.status === 'loading') body = html`<${CatalogLoading}/>`;
  else if (cat.status === 'error') body = html`<${CatalogError} err=${cat.err} onRetry=${loadCat}/>`;
  else if (game === 'builds') body = html`<${Builds}/>`;
  else if (game === 'auction') body = html`<${Auction}/>`;
  else if (game === 'guess') body = html`<${Guess}/>`;
  else if (game === 'budget') body = html`<${Budget}/>`;
  else if (game === 'cards') body = html`<${Cards}/>`;
  else if (game === 'roulette') body = html`<${Roulette}/>`;
  else if (localRun) body = html`<${LocalGame} run=${localRun} onExit=${() => setLocalRun(null)}/>`;
  else if (roomCode && dbh.status === 'ready') body = html`<${OnlineRoom} db=${dbh.db} uid=${dbh.uid} code=${roomCode} canWrite=${dbh.canWrite} onLeave=${leaveRoom}/>`;
  else body = html`<${Lobby} cfg=${cfg} setCfg=${setCfg} names=${names} setNames=${setNames} conn=${conn} setConn=${setConn} dbh=${dbh}
      onStartLocal=${() => setLocalRun({cfg:{...cfg}, names:{A:names.A.trim() || 'Игрок А', B:names.B.trim() || 'Игрок Б'}})}
      onCreate=${create} onJoin=${join} busy=${busy} error=${error}/>`;

  return html`<${PrefCtx.Provider} value=${prefs}><${TipHost}>
    <div className="shell">
      ${showRules ? html`<${RulesModal} onClose=${() => setShowRules(false)}/>` : null}
      ${showSet ? html`<${SettingsModal} prefs=${prefs} setPrefs=${setPrefs} onClose=${() => setShowSet(false)}/>` : null}
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <button className="brand" style=${{background:'none',border:0,cursor:'pointer',padding:0}} onClick=${() => openGame(null)} title="К выбору игры"><${Soul} size=${18}/>Deadlock Minigames${game ? html`<span className="muted" style=${{fontSize:'14px',fontWeight:400}}> / ${GAME_NAME[game]}</span>` : null}</button>
        <span className="flex gap-2"><button className="gear" onClick=${() => setShowRules(true)} aria-label="Как играть" title="Как играть" style=${{fontFamily:'var(--f-head)',fontWeight:800,fontSize:'18px'}}>?</button><button className="gear" onClick=${() => setShowSet(true)} aria-label="Настройки" title="Настройки"><${GearIcon}/></button></span>
      </div>
      ${cat.stale ? html`<div className="panel p-3 mb-3 flex flex-wrap items-center justify-between gap-2"><span className="muted" style=${{fontSize:'13px'}}>Не удалось обновить каталог. Используется сохранённая копия от ${new Date(cat.t).toLocaleDateString('ru-RU')}.</span><button className="btn sm" onClick=${loadCat}>Обновить</button></div>` : null}
      <div key=${game || 'hub'} className="view-in">${body}</div>
      <${Footer}/>
    </div>
  <//><//>`;
}
// Если где-то в коде случится ошибка, вместо белого экрана покажем понятное сообщение с кнопкой «Перезагрузить».
class ErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state = {err:null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err){ try { console.error(err); } catch (e){} }
  render(){
    if (!this.state.err) return this.props.children;
    return html`<div className="panel" style=${{maxWidth:'520px',margin:'60px auto',padding:'24px',textAlign:'center'}}>
      <div className="panel-h" style=${{fontSize:'22px'}}>Что-то пошло не так</div>
      <p className="muted" style=${{margin:'10px 0 16px'}}>Сайт наткнулся на ошибку. Обычно помогает перезагрузка. Если повторяется, напиши автору, что делал перед этим.</p>
      <button className="btn gold" onClick=${() => location.reload()}>Перезагрузить</button>
    </div>`;
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${ErrorBoundary}><${App}/><//>`);
</script>
</body>
</html>
