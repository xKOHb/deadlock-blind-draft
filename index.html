/* Оккультный нуар 1930-х, арт-деко: угольные фоны, кремовый текст, тусклое золото. Рамки со ступенчатыми углами. */
:root{
  --bg:#141311; --bg2:#1a1815; --panel:#22201c; --panel2:#2a2722; --edge:#4a4132; --edge2:#6b5d44;
  --text:#ece1c8; --muted:#a99e86; --gold:#b8975a; --gold2:#e0c58a; --goldDim:#6e5a34;
  --acc:184,151,90; --btn1:#e3c883; --btn2:#a8843f; --btn3:#f0d9a0; --btn4:#d9bd7e;
  --teal:#8fc2a0; --red:#d0685c; --soul:#7ec4d1;
  --t1:#6fb35c; --t2:#e68a2e; --t3:#a67ee6; --t4:#f0c54e;
  --f-head:'Playfair Display',Georgia,serif; --f-display:'Oswald','Arial Narrow',sans-serif; --f-ihead:'Russo One','Oswald',Arial,sans-serif; --f-itext:'Rubik','Barlow',system-ui,sans-serif; --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --step:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.5 var(--f-body);
  background-image:radial-gradient(900px 480px at 50% -80px,rgba(var(--acc),.16),transparent 70%),
    linear-gradient(45deg,rgba(var(--acc),.04) 25%,transparent 25% 75%,rgba(var(--acc),.04) 75%),
    linear-gradient(45deg,rgba(var(--acc),.04) 25%,transparent 25% 75%,rgba(var(--acc),.04) 75%);
  background-size:auto,28px 28px,28px 28px;background-position:0 0,0 0,14px 14px;background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.shell{max-width:1320px;margin:0 auto}
.disp{font-family:var(--f-display);letter-spacing:.04em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.inl{display:inline-flex;align-items:center;gap:6px}
.brand{font-family:var(--f-head);font-weight:700;font-size:20px;color:var(--gold2);display:flex;align-items:center;gap:8px}
.hero{position:relative;isolation:isolate;padding-top:10px}
.hero::before{content:"";position:absolute;left:50%;bottom:-10px;width:min(760px,100%);height:150%;transform:translateX(-50%);z-index:-1;
  background:repeating-conic-gradient(from -90deg at 50% 88%,rgba(var(--acc),.17) 0 4deg,transparent 4deg 10deg);
  -webkit-mask:radial-gradient(ellipse 60% 70% at 50% 88%,#000,transparent 75%);mask:radial-gradient(ellipse 60% 70% at 50% 88%,#000,transparent 75%)}
.hero-t{font-family:var(--f-head);font-weight:800;font-size:clamp(42px,9vw,78px);line-height:1.02;margin:6px 0 8px;color:var(--gold2);text-shadow:0 3px 0 #000,0 0 28px rgba(var(--acc),.28)}

/* панели: двойная рамка + золотые уголки */
.panel{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--edge);--c:var(--gold);--g:linear-gradient(var(--c),var(--c))}
.panel::before{content:"";position:absolute;inset:4px;border:1px solid rgba(var(--acc),.22);pointer-events:none}
.panel::after{content:"";position:absolute;inset:-1px;pointer-events:none;background:
  var(--g) 0 0/16px 2px no-repeat,var(--g) 0 0/2px 16px no-repeat,var(--g) 100% 0/16px 2px no-repeat,var(--g) 100% 0/2px 16px no-repeat,
  var(--g) 0 100%/16px 2px no-repeat,var(--g) 0 100%/2px 16px no-repeat,var(--g) 100% 100%/16px 2px no-repeat,var(--g) 100% 100%/2px 16px no-repeat}
.panel.active{border-color:var(--gold2);--c:var(--gold2);box-shadow:0 0 0 1px var(--goldDim),0 0 22px rgba(224,197,138,.14)}
.panel-h{font-family:var(--f-head);font-weight:700;font-size:16px;color:var(--gold2)}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--edge2),transparent);border:0;margin:0}

/* кнопки */
button.btn{font-family:var(--f-display);font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:14px;padding:10px 20px;cursor:pointer;color:var(--text);
  border:1px solid var(--gold);background:linear-gradient(180deg,#322e27,#221f1b);box-shadow:inset 0 0 0 3px #1a1815,inset 0 0 0 4px rgba(var(--acc),.4);transition:filter .15s,transform .1s}
button.btn:hover:not(:disabled){filter:brightness(1.2);border-color:var(--gold2)}
button.btn:active:not(:disabled){transform:translateY(1px)}
button.btn:disabled{opacity:.4;cursor:not-allowed}
button.btn.gold{background:linear-gradient(180deg,var(--btn1),var(--btn2));color:#1a1409;border-color:var(--btn3);box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 0 4px rgba(26,20,9,.55);font-weight:600}
button.btn.sm{padding:6px 12px;font-size:12px;box-shadow:inset 0 0 0 2px #1a1815}
button.btn.danger:hover:not(:disabled){border-color:var(--red);color:#f2b4ac}
button.btn:focus-visible,button.seg-b:focus-visible,.card:focus-visible,.tierb:focus-visible,.c-info:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--gold);background:var(--bg2)}
button.seg-b{font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase;font-size:12px;padding:6px 14px;cursor:pointer;color:var(--muted);background:transparent;border:0}
button.seg-b.on{background:linear-gradient(180deg,var(--btn4),var(--btn2));color:#1a1409;font-weight:600}
button.seg-b:not(.on):hover{color:var(--text)}
input.fld{background:var(--bg2);border:1px solid var(--edge2);color:var(--text);padding:9px 12px;font-family:var(--f-body);font-size:15px;width:100%;outline:none}
input.fld:focus{border-color:var(--gold2)}
input[type=range]{accent-color:var(--gold);width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border:1px solid var(--edge2);font-size:12px;background:var(--bg2);color:var(--muted)}
.chip.ok{border-color:var(--teal);color:var(--teal)}
.chip.gold{border-color:var(--gold);color:var(--gold2)}
.tchip{font-variant-numeric:lining-nums;display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 8px;font-family:var(--f-display);font-size:12px;letter-spacing:.05em;border:1px solid currentColor;color:var(--tc);background:rgba(255,255,255,.03)}
.soul{color:var(--soul)}
.soul-i{display:inline-block;vertical-align:-1px;margin-right:3px;color:var(--soul)}

/* плитки предметов: цвет по слоту, как в магазине игры */
:root{--s-weapon:#e58a1f;--s-spirit:#9a62d6;--s-vitality:#7fb53a}
.ico{display:block;object-fit:cover}
.mono{display:inline-flex;align-items:center;justify-content:center;aspect-ratio:1;position:relative;color:var(--tc,var(--gold2));border:1px solid currentColor;transform:rotate(45deg);font-size:0}
.mono::after{content:attr(data-l);transform:rotate(-45deg);font-size:18px;font-family:var(--f-head);font-weight:700;position:absolute}
.face-in,.slot.full,.trayslot.f{background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 10%,#f6efde),color-mix(in srgb,var(--tc) 22%,#e9dfc6))}
.card{position:relative;width:var(--cw);aspect-ratio:3/4;perspective:800px;cursor:pointer;flex:none;transition:transform .2s,filter .2s,opacity .2s;-webkit-tap-highlight-color:transparent}
.sz-s{--cw:78px}.sz-g{--cw:104px}.sz-t{--cw:124px}
@media (max-width:640px){.sz-g{--cw:88px}.sz-t{--cw:94px}.sz-s{--cw:70px}}
.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.75,.2,1)}
.card.is-back .card-inner{transform:rotateY(180deg)}
.face,.back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;clip-path:var(--step)}
.face{background:var(--tc)}
.face-in,.back-in{position:absolute;inset:2px;clip-path:var(--step);overflow:hidden}
.c-art{position:absolute;inset:0 0 30% 0;overflow:hidden}
.c-art .ico,.slot.full .ico,.trayslot.f .ico{width:100%;height:100%;mix-blend-mode:multiply}
.c-art .mono{width:42%;margin:20% auto 0;display:flex}
.c-tier{position:absolute;top:0;right:0;width:40%;aspect-ratio:1;background:var(--tc);clip-path:polygon(0 0,100% 0,100% 100%);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);display:flex;justify-content:flex-end;align-items:flex-start;padding:calc(var(--cw)*.025) calc(var(--cw)*.04) 0 0;font:800 max(9px,calc(var(--cw)*.125))/1 var(--f-head);letter-spacing:.02em}
.c-price{position:absolute;left:3px;top:3px;font-size:calc(var(--cw)*.1);font-weight:600;color:var(--soul);background:rgba(20,15,8,.82);padding:0 4px;line-height:1.45}
.c-name{position:absolute;left:0;right:0;bottom:0;height:30%;padding:0 4px;font-family:var(--f-itext);font-size:calc(var(--cw)*.105);line-height:1.1;font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;color:#1b140a;overflow:hidden;word-break:break-word}
.sz-s .c-name{display:none}.sz-s .c-art{bottom:0}
.c-info{position:absolute;right:calc(var(--cw)*.05);top:calc(var(--cw)*.36);width:18px;height:18px;border-radius:50%;border:1px solid var(--edge2);background:#14120f;color:var(--muted);font-size:11px;line-height:16px;padding:0;cursor:pointer;opacity:0;transition:opacity .15s;z-index:2}
.card:hover .c-info,.c-info:focus-visible{opacity:1}
@media (hover:none){.c-info{opacity:.85}}
.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--gold2),var(--goldDim))}
.back-in{background:repeating-conic-gradient(from 0deg at 50% 62%,#1d1a15 0 6deg,#292419 6deg 12deg);display:flex;align-items:center;justify-content:center}
.back-in span{width:calc(var(--cw)*.4);height:calc(var(--cw)*.4);transform:rotate(45deg);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;background:rgba(14,12,9,.85)}
.back-in span i{transform:rotate(-45deg);font-style:normal;display:flex}
.back-in b{position:absolute;left:9px;top:6px;font-family:var(--f-head);color:var(--gold2);font-size:calc(var(--cw)*.15)}
.card.pickable:hover .card-inner{transform:translateY(-6px) rotateY(180deg)}
.card.pickable{filter:drop-shadow(0 0 10px rgba(224,197,138,.45))}
.card.pickable.is-back:hover{filter:drop-shadow(0 0 16px rgba(240,217,160,.85))}
.card.sel{transform:translateY(-6px);filter:drop-shadow(0 0 12px rgba(240,217,160,.7))}
.card:not(.banned):hover{scale:1.07;z-index:5;filter:drop-shadow(0 0 3px rgba(255,236,170,.95)) drop-shadow(0 0 14px rgba(240,217,160,.75))}
.slot.full{transition:scale .15s,filter .15s}.slot.full:hover{scale:1.1;z-index:5;filter:drop-shadow(0 0 3px rgba(255,236,170,.95)) drop-shadow(0 0 10px rgba(240,217,160,.7))}
.card.banned{opacity:.34;filter:grayscale(.8);cursor:not-allowed}
.card.faded{opacity:.5;filter:saturate(.5)}
.card.taken{filter:drop-shadow(0 0 12px rgba(143,194,160,.7))}
.tag{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);white-space:nowrap;font-family:var(--f-display);letter-spacing:.08em;font-size:11px;padding:1px 8px;pointer-events:none;background:var(--gold2);color:#1a1409;z-index:2}
.tag-banned{background:#2d2a24;color:#bdb39a;border:1px solid var(--edge2)}
.tag-taken{background:var(--teal);color:#0f2018}
/* вкладки слотов */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;min-width:42px;padding:0 10px;border:0;cursor:pointer;background:var(--tc);color:#1b140a;clip-path:var(--step);font-family:var(--f-display);font-weight:600;font-size:14px;opacity:.7}
.tab.on{opacity:1;padding:0 16px}
.tab:not(.on) .tl{display:none}
.tab:hover{opacity:1}
.tab:focus-visible{outline:2px solid var(--gold2)}
/* инвентарь */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
@media (min-width:480px){.slots{grid-template-columns:repeat(4,1fr)}}
.slot{aspect-ratio:1;position:relative;border:1px dashed var(--edge);background:rgba(255,255,255,.015);display:flex;align-items:center;justify-content:center;color:var(--edge2);font-family:var(--f-display);font-size:12px}
.slot.full{border:1px solid var(--tc);cursor:help;clip-path:var(--step);overflow:hidden}
.slot.full .mono{width:40%}
.slot.full .p{position:absolute;bottom:0;right:0;padding:0 4px;font-size:10px;color:var(--soul);background:rgba(20,15,8,.82);font-weight:600}
.slot.new{box-shadow:0 0 0 2px var(--teal),0 0 14px rgba(143,194,160,.55);animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

/* подсказка, модалка */
.tip{position:fixed;z-index:60;width:340px;pointer-events:none;filter:drop-shadow(0 12px 24px rgba(0,0,0,.6))}
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(8,7,5,.8);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:min(380px,100%);filter:drop-shadow(0 12px 30px rgba(0,0,0,.7))}
.ii{background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 62%,#18130b),color-mix(in srgb,var(--tc) 40%,#120e08));border:1px solid var(--tc);clip-path:var(--step);padding:14px 16px 16px;color:#fbf3e0}
.ii-name{font-family:var(--f-ihead);font-weight:400;font-size:23px;line-height:1.15;letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.ii-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 10px;font-size:17px;font-weight:600}
.ii-meta .soul{color:#8fe3e8}
.stat-line{display:flex;gap:8px;align-items:baseline;line-height:1.5}
.stat-line b{font-size:17px;font-weight:700;min-width:64px;font-variant-numeric:tabular-nums}
.stat-line span{font-size:14px;font-family:var(--f-itext)}
.stat-line b{font-family:var(--f-itext)}

.ii-txt{font-family:var(--f-itext);font-size:13.5px;line-height:1.5;color:#efe6d0}
.ii-secs{margin:12px -16px -16px;background:rgba(0,0,0,.32)}
.ii-sec{padding:6px 16px 8px;display:flex;flex-direction:column;gap:4px;font-size:13px;font-family:var(--f-itext)}
.ii-st{font-family:var(--f-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#d9cfb6}
.c-badge{position:absolute;left:50%;bottom:30%;transform:translate(-50%,50%);z-index:2;font:700 calc(var(--cw)*.072)/1 var(--f-display);padding:2px 5px;background:#111;color:#fff;letter-spacing:.04em;white-space:nowrap}.c-badge.imb{background:#5b3490}
.hl{font-weight:600;color:#fff}.dim{opacity:.7;font-size:12px}

.ii-mline b{font-weight:600}

html{min-height:100%}body{min-height:100vh;background-attachment:fixed,fixed,fixed}
.faq{padding:0}.faq-btn{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.faq-btn:focus-visible{outline:2px solid var(--gold2);outline-offset:-4px}.faq-btn .faq-q{margin:0}

/* ===== темы оформления: меняют цвета, фон и узор всего сайта ===== */

<body>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script id="logic">
/* ======================= КАТАЛОГ ПРЕДМЕТОВ (динамическая загрузка) =======================
   Хардкода нет: при старте качаем предметы из Deadlock Assets API (сообщество датамайнеров) на английском и русском,
   разбираем в формат игры: {id, name{en,ru}, tier, price, image(URL), stats[{l{en,ru}, v}], desc{en,ru}, slot, active}.
   Цена всегда считается по тиру, чтобы экономика игры не зависела от патчей. */
const TIER_PRICE = {1:800, 2:1600, 3:3200, 4:6400};
const ROMAN = ['', 'I', 'II', 'III', 'IV'];
const SLOT_LABEL = {weapon:'Оружие', spirit:'Спиритизм', vitality:'Живучесть'};
const slotKey = v => ({weapon:'weapon', armor:'vitality', vitality:'vitality', tech:'spirit', spirit:'spirit'})[String(v || '').toLowerCase()] || '';
const slotColor = i => 'var(--s-' + (i.slot || 'none') + ', var(--gold))';
const norm = v => String(v || '').toLowerCase().replace(/ё/g, 'е');
// Поиск: каждое слово запроса должно встретиться в названии или в названиях характеристик предмета.
function matchItem(item, q){
  const words = norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return true;
  const hay = norm([item.name.ru, item.name.en].concat((item.innate || item.stats).map(x => x.l.ru + ' ' + x.l.en)).join(' | '));
  return words.every(w => hay.includes(w));
}
const API_BASE = 'https://api.deadlock-api.com/v1/assets/items';   // старый хост assets.deadlock-api.com больше не существует
let ITEMS = [], CATALOG = {};
const stubItem = id => ({id, name:{en:id, ru:id}, tier:1, price:TIER_PRICE[1], image:'', stats:[], desc:{en:'', ru:''}, slot:'', active:false, missing:true});
// BY_ID[id] никогда не падает: если у соперника другая версия каталога, вернётся заглушка.
const BY_ID = new Proxy({}, {get:(_, id) => typeof id === 'string' ? (CATALOG[id] || stubItem(id)) : undefined});
let CAT_VER = '';
function setCatalog(list){
  let h = 5381; list.map(i => [i.id, i.tier, i.price, (i.comps || []).join('+'), i.active ? 1 : 0].join(':')).join('|').split('').forEach(ch => { h = ((h * 33) ^ ch.charCodeAt(0)) >>> 0; });
  CAT_VER = h.toString(36);
  ITEMS = list; CATALOG = Object.fromEntries(list.map(i => [i.id, i])); }

async function getJson(url, ms = 15000){
  // Без AbortController: в песочницах (превью) signal нельзя передать через postMessage.
  let t;
  const timeout = new Promise((_, rej) => { t = setTimeout(() => rej(new Error('таймаут')), ms); });
  try {
    const r = await Promise.race([fetch(url), timeout]);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
async function fetchItems(lang){
  const urls = lang === 'english' ? [API_BASE + '?language=english', API_BASE] : [API_BASE + '?language=' + lang];
  const errs = [];
  for (const u of urls){
    try { const j = await getJson(u); if (Array.isArray(j) && j.length) return j; errs.push(u + ' - пустой ответ'); }
    catch (e){ errs.push(u + ' - ' + (e && e.name === 'AbortError' ? 'таймаут' : (e && e.message) || 'ошибка сети')); }
  }
  throw new Error(errs.join('\n'));
}
const strip = s => String(s == null ? '' : s).replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
function descOf(d){
  if (!d) return '';
  if (typeof d === 'string') return strip(d);
  const seen = [];
  [d.desc, d.passive, d.active].forEach(x => { const t = strip(x); if (t && !seen.includes(t)) seen.push(t); });
  return seen.join(' ').slice(0, 700);
}
// properties: {ключ:{value, label, prefix, postfix, ...}} -> {ключ:{l, v}}
function statsOf(props){
  const out = {};
  if (!props || typeof props !== 'object') return out;
  Object.keys(props).forEach(k => {
    const p = props[k]; if (!p || typeof p !== 'object') return;
    const label = strip(p.label), raw = p.value, num = parseFloat(String(raw).replace(',', '.'));
    if (!label || !isFinite(num) || num === 0 || p.disable_value) return;
    const pre = strip(p.prefix), post = strip(p.postfix);
    const lead = pre && !pre.includes('{') ? pre : (num > 0 && !/^[+-]/.test(String(raw)) ? '+' : '');
    out[k] = {l:label, v:lead + String(raw) + (post.includes('{') ? '' : post)};
  });
  return out;
}
// единицы: API иногда отдаёт "mm" вместо "m/s"; для русского переводим единицы
const fmtV = (v, ru) => { v = String(v).replace(/mm$/, 'm/s'); return ru ? v.replace(/m\/s$/, ' м/с').replace(/(\d)\s*s$/, '$1 с') : v; };
// Данные из tooltip_sections (то, что рисует сама игра): постоянные статы, пассивные/активные блоки, плитки, длительность, окно применения, перезарядка.
// ---- Разбор карточки предмета ТАК ЖЕ, как её рисует игра: tooltip_sections ----
// innate = постоянные статы; passive/active = блок с текстом, плитками (important/elevated), строками (длительность, окно применения...) и перезарядкой.
function fmtProp(p, lang, rp){
  const ru = lang === 'ru', q = (ru && rp) ? rp : p;
  const num = parseFloat(String(p.value == null ? '' : p.value).replace(',', '.').replace(/[^\d.\-]/g, ''));
  if (!isFinite(num) || num === 0) return null;
  if (p.disable_value != null && parseFloat(p.disable_value) === num) return null;
  const pre = String(p.prefix || '').trim();
  const sign = pre === '-' ? '-' : pre === '+' ? '+' : pre.includes('{s:sign}') ? (num >= 0 ? '+' : '-') : (num < 0 ? '-' : '');
  let n = String(Math.round(Math.abs(num) * 100) / 100); if (ru) n = n.replace('.', ',');
  let post = String(q.postfix || '').trim(); if (post.includes('{')) post = '';
  if (ru){ if (/^(с\.?|сек\.?)$/.test(post)) post = ' с'; else if (/^м\/[cс]$/.test(post)) post = ' м/с'; else if (post === 'м') post = ' м'; else if (/^[A-Za-zА-Яа-я\/]{2,}/.test(post) || /^% /.test(post)) post = ' ' + post; }
  else { if (p.css_class === 'move_speed' && post === 'm') post = 'm/s'; if (/^[A-Za-z\/]{2,}/.test(post) || /^% /.test(post)) post = ' ' + post; }
  return sign + n + post;
}
function propEntry(x, r, k){
  const p = x.properties && x.properties[k]; if (!p || typeof p !== 'object') return null;
  const rp = (r.properties || {})[k], tech = p.provided_property_type === 'MODIFIER_VALUE_TECH_POWER';
  const en = fmtProp(p, 'en', rp), ru = fmtProp(p, 'ru', rp);
  const le = tech ? 'Spirit Power' : strip(p.label), lr = tech ? 'ед. к спиритической мощи' : strip((rp && rp.label) || p.label);
  const lrFix = k === 'BonusAbilityDurationPercent' ? 'к длительности умений' : null;   // так подписано в игре
  if (!en || !le) return null;
  return {l:{en:le, ru:lrFix || lr || le}, v:{en, ru:ru || en}, css:p.css_class || '', key:k};
}
const RU_TEXT_FIX = [['Нажав Перезарядка', 'Нажав R']];   // в API вместо клавиши подставлено название действия
function buildSections(x, r){
  const secs = Array.isArray(x.tooltip_sections) ? x.tooltip_sections : [], rs = Array.isArray(r.tooltip_sections) ? r.tooltip_sections : [];
  const innate = [], blocks = [], d = x.description || {}, rd = r.description || {};
  secs.forEach((sec, si) => (sec.section_attributes || []).forEach((at, ai) => {
    const rat = (((rs[si] || {}).section_attributes) || [])[ai] || {};
    const type = sec.section_type || (x.is_active_item ? 'active' : 'passive');
    const list = a => (a || []).map(k => propEntry(x, r, k)).filter(Boolean);
    const props = list(at.properties), imp = list((at.important_properties || []).concat(at.important_properties_with_icon || [])), elev = list(at.elevated_properties);
    if (type === 'innate'){ props.concat(elev, imp).forEach(e => innate.push(e)); return; }
    const cdE = props.concat(imp).find(e => e.css === 'cooldown');
    let te = at.loc_string || d[type] || d.desc || '', tr = rat.loc_string || rd[type] || rd.desc || te;
    RU_TEXT_FIX.forEach(f => { tr = tr.split(f[0]).join(f[1]); });
    blocks.push({type, cd:cdE ? cdE.v : null, text:{en:te, ru:tr}, tiles:imp.concat(elev).filter(e => e !== cdE), meta:props.filter(e => e !== cdE)});
  }));
  return {innate, blocks};
}
function parseCatalog(en, ru){
  const ruBy = {}; (ru || []).forEach(x => { if (x && x.class_name) ruBy[x.class_name] = x; });
  const seen = new Set(), list = [];
  en.forEach(x => {
    if (!x || !x.class_name || seen.has(x.class_name)) return;
    const tier = Number(x.item_tier != null ? x.item_tier : x.tier);
    if (!(tier >= 1 && tier <= 4)) return;                       // тир 5 (легендарные Street Brawl) не берём
    if (x.type && x.type !== 'upgrade') return;
    if (x.shopable === false || x.disabled === true) return;
    seen.add(x.class_name);
    const r = ruBy[x.class_name] || x, se = statsOf(x.properties), sr = statsOf(r.properties);
    const cdKey = Object.keys(se).find(k => /cooldown/i.test(k) && !/reduc|bonus|spirit/i.test(k));
    const cd = cdKey ? parseFloat(x.properties[cdKey].value) : 0;
    if (cdKey) delete se[cdKey];
    list.push({
      id:x.class_name, name:{en:x.name || x.class_name, ru:r.name || x.name || x.class_name}, tier, price:TIER_PRICE[tier],
      image:x.shop_image_webp || x.shop_image || x.image_webp || x.image || '',
      stats:Object.keys(se).slice(0, 5).map(k => ({l:{en:se[k].l, ru:(sr[k] || se[k]).l}, v:se[k].v})),
      slot:slotKey(x.item_slot_type), active:!!x.is_active_item, imbue:x.imbue || '', cd, comps:Array.isArray(x.component_items) ? x.component_items.filter(c => typeof c === 'string') : [],
      desc:{en:descOf(x.description), ru:descOf(r.description) || descOf(x.description)}
    });
    const it = list[list.length - 1], sc = buildSections(x, r);
    if (sc.innate.length || sc.blocks.length){ it.innate = sc.innate; it.blocks = sc.blocks; }
  });
  list.forEach(i => { i.comps = i.comps.filter(c => seen.has(c)); });
  list.forEach(i => { i.up = list.filter(o => o.comps.includes(i.id)).map(o => o.id); });
  const cnt = [1, 2, 3, 4].map(t => list.filter(i => i.tier === t).length);
  if (cnt.some(c => c < 6)) throw new Error('Каталог пришёл неполным (предметов по тирам: ' + cnt.join(' / ') + '). Формат API мог измениться.');
  return list.sort((a, b) => a.tier - b.tier || a.name.en.localeCompare(b.name.en));   // одинаковый порядок у обоих игроков
}
// Сначала берём файлы каталога с самого сайта (у всех игроков одна версия), если их нет, то API.
async function fetchLocal(code){
  for (const n of ['items-' + code + '.min.json', 'items-' + code + '.json']){
    try { const j = await getJson(n, 20000); if (Array.isArray(j) && j.length > 24) return j; } catch (e){}
  }
  return null;
}
async function loadCatalog(){
  const le = await fetchLocal('en'), lr = le ? await fetchLocal('ru') : null;
  if (le && lr) return parseCatalog(le, lr);
  const en = await fetchItems('english');
  let ru = null; try { ru = await fetchItems('russian'); } catch (e){ console.warn('Русская локализация недоступна', e); }
  return parseCatalog(en, ru);
}
const MIN_ROUNDS = 4, MAX_ROUNDS = 12, SLOTS = 12, HIDE_COUNT = 3;
const SEAT_LABEL = {A:'А', B:'Б'};
const other = s => (s === 'A' ? 'B' : 'A');

/* ======================= ЛОГИКА ИГРЫ ======================= */
// Баланс: тир раунда общий. 'ramp' равномерно растягивает 1..4 на все раунды, 'cycle' идёт 1,2,3,4,1,2...
// Хаос: тир каждый игрок выбирает сам, возвращаем null.
function tierForRound(settings, r){
  if (settings.mode !== 'balance') return null;
  if (settings.order === 'cycle') return ((r - 1) % 4) + 1;
  return Math.ceil(r * 4 / settings.rounds);
}
// Правило сборок как в игре: у каждого предмета один экземпляр, а улучшение «съедает» свои компоненты.
// Поэтому два предмета несовместимы, если у них есть общий компонент (или один входит в другой):
// нельзя иметь и Sprint Boots, и Trophy Collector; нельзя иметь два разных улучшения одного и того же предмета.
const MAX_ACTIVE = 4;   // в игре максимум 4 активных предмета
let _closFor = null, _clos = {};
function closureOf(id){
  if (_closFor !== ITEMS){ _closFor = ITEMS; _clos = {}; }
  if (_clos[id]) return _clos[id];
  const out = new Set([id]), it = BY_ID[id];
  ((it && it.comps) || []).forEach(c => closureOf(c).forEach(x => out.add(x)));
  return (_clos[id] = out);
}
function blockedSet(ids){
  const have = new Set(), list = Array.from(ids);
  list.forEach(id => closureOf(id).forEach(x => have.add(x)));
  const out = new Set(list);
  if (list.filter(id => BY_ID[id] && BY_ID[id].active).length >= MAX_ACTIVE) ITEMS.forEach(i => { if (i.active) out.add(i.id); });
  ITEMS.forEach(i => { for (const x of closureOf(i.id)){ if (have.has(x)){ out.add(i.id); break; } } });
  return out;
}
function ownedSet(inv, seat){ return blockedSet(inv[seat].map(x => x.id)); }
function availableOfTier(tier, ownedIds){ return ITEMS.filter(i => i.tier === tier && !ownedIds.has(i.id)); }

// Состояние раунда выводится из ходов. moves[seat][round] = {hide:[id,id,id], tier, pick:{idx,id}, ready}
// hide - 3 карты, которые seat загадал сопернику. pick - карта, которую seat взял из карт соперника.
function derive(settings, moves){
  const N = settings.rounds;
  const inv = {A:[], B:[]};
  let round = 1, phase = 'hide', finished = false;
  for (let r = 1; r <= N; r++){
    const a = (moves.A && moves.A[r]) || {};
    const b = (moves.B && moves.B[r]) || {};
    if (a.pick) inv.A.push({id:a.pick.id, round:r});
    if (b.pick) inv.B.push({id:b.pick.id, round:r});
    round = r;
    if (!(a.hide && b.hide)){ phase = 'hide'; break; }
    if (!(a.pick && b.pick)){ phase = 'pick'; break; }   // выбирать можно одновременно или в любом порядке
    if (!(a.ready && b.ready)){ phase = 'recap'; break; }
    if (r === N){ finished = true; phase = 'done'; }
  }
  return {round, phase, inv, finished};
}
function totalSouls(list){ return list.reduce((s, x) => s + BY_ID[x.id].price, 0); }
function genCode(){
  const abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let c = ''; for (let i = 0; i < 5; i++) c += abc[Math.floor(Math.random() * abc.length)];
  return c;
}

function RichText({html: h}){
  const nodes = useMemo(() => {
    try {
      const doc = new DOMParser().parseFromString('<div>' + h + '</div>', 'text/html');
      let k = 0;
      const walk = n => {
        if (n.nodeType === 3) return n.textContent;
        if (n.nodeType !== 1) return null;
        const t = n.tagName.toLowerCase(); if (t === 'svg' || t === 'img') return null;
        const kids = Array.from(n.childNodes).map(walk), cl = n.getAttribute('class') || '';
        if (t === 'br') return React.createElement('br', {key:k++});
        if (/highlight|inline-attribute-label/.test(cl)) return React.createElement('b', {key:k++, className:'hl'}, ...kids);
        if (/diminish/.test(cl)) return React.createElement('span', {key:k++, className:'dim'}, ...kids);
        return React.createElement(React.Fragment, {key:k++}, ...kids);
      };
      return Array.from(doc.body.firstChild.childNodes).map(walk);
    } catch (e){ return [strip(h)]; }
  }, [h]);
  return html`<${Fragment}>${nodes}<//>`;

/* Структура базы:
   games/{CODE}/meta            {code, hostId, status:'lobby'|'playing', rounds, mode, order, createdAt}
   games/{CODE}/seats/A|B       {uid, name, joinedAt}
   games/{CODE}/moves/{A1,B3..} {seat, round, hide:[id,id,id], tier, pick:{idx,id}, ready}  */
function useRoom(db, code){
  const [st, setSt] = useState({meta:null, seats:{}, moves:{A:{}, B:{}}, got:{meta:false, seats:false, moves:false}, error:null, slow:false});
  useEffect(() => {
    if (!db || !code) return;
    const base = db.ref('games/' + code);
    const err = e => setSt(s => ({...s, error:(e && e.message) || 'Ошибка связи с Firebase'}));
    const timer = setTimeout(() => setSt(s => (s.got.meta && s.got.seats && s.got.moves) ? s : {...s, slow:true}), 10000);
    const rMeta = base.child('meta'), rSeats = base.child('seats'), rMoves = base.child('moves');
    const onMeta = rMeta.on('value', snap => setSt(s => ({...s, meta:snap.val(), got:{...s.got, meta:true}})), err);
    const onSeats = rSeats.on('value', snap => setSt(s => ({...s, seats:snap.val() || {}, got:{...s.got, seats:true}})), err);
    const onMoves = rMoves.on('value', snap => {
      const m = {A:{}, B:{}}, v = snap.val() || {};
      Object.keys(v).forEach(k => { const x = v[k]; if (x && m[x.seat]) m[x.seat][x.round] = x; });
      setSt(s => ({...s, moves:m, got:{...s.got, moves:true}}));
    }, err);
    return () => {
      clearTimeout(timer);
      rMeta.off('value', onMeta); rSeats.off('value', onSeats); rMoves.off('value', onMoves);
    };
  }, [db, code]);
  return {...st, loaded: st.got.meta && st.got.seats && st.got.moves};
}

function useOnlineSession(db, uid, code){
  const room = useRoom(db, code);
  const [wErr, setWErr] = useState(null);
  const {meta, seats, moves} = room;
  const mySeat = seats.A && seats.A.uid === uid ? 'A' : (seats.B && seats.B.uid === uid ? 'B' : null);
  const fail = e => setWErr((e && e.message) || 'Не удалось записать данные');
  const write = useCallback((seat, round, patch) => {
    db.ref('games/' + code + '/moves/' + seat + round).update({...patch, seat, round}).catch(fail);
  }, [db, code]);
  const names = {A:(seats.A && seats.A.name) || 'Игрок А', B:(seats.B && seats.B.name) || 'Игрок Б'};
  const settings = meta ? {rounds:meta.rounds, mode:meta.mode, order:meta.order} : null;
  return {
    kind:'online', room, meta, seats, mySeat, names, settings, moves, wErr, clearErr:() => setWErr(null),
    viewerSeats:mySeat ? [mySeat] : [], error:room.error,
    hide:(seat, round, tier, ids) => write(seat, round, {hide:ids, tier}),
    pick:(seat, round, idx, id) => write(seat, round, {pick:{idx, id}}),
    ready:(seat, round) => write(seat, round, {ready:true}),
    updateMeta:p => db.ref('games/' + code + '/meta').update(p).catch(fail)
  };
}

async function createRoom(db, uid, name, cfg){
  for (let i = 0; i < 6; i++){
    const code = genCode();
    const res = await db.ref('games/' + code + '/meta').transaction(cur => (
      cur === null ? {code, ver:CAT_VER, hostId:uid, status:'lobby', rounds:cfg.rounds, mode:cfg.mode, order:cfg.order, createdAt:Date.now()} : undefined
    ));
    if (!res.committed) continue;            // код уже занят, пробуем другой
    await db.ref('games/' + code + '/seats/A').set({uid, name, joinedAt:Date.now()});
    return code;
  }
  throw new Error('Не удалось создать комнату, попробуй ещё раз');
}
async function joinRoom(db, uid, rawCode, name){
  const code = rawCode.trim().toUpperCase();
  if (code.length < 4) throw new Error('Введи код комнаты');
  const base = db.ref('games/' + code);
  const metaSnap = await base.child('meta').once('value');
  if (!metaSnap.exists()) throw new Error('Комната не найдена. Проверь код.');
  const aSnap = await base.child('seats/A').once('value');
  if (aSnap.exists() && aSnap.val().uid === uid) return code;   // это хост
  const bSnap = await base.child('seats/B').once('value');
  if (bSnap.exists() && bSnap.val().uid === uid) return code;   // уже сидим на месте Б
  const mv = metaSnap.val();
  if (mv.ver && CAT_VER && mv.ver !== CAT_VER) throw new Error('У вас разные версии каталога предметов (у хоста ' + mv.ver + ', у тебя ' + CAT_VER + '). Обнови страницу (Ctrl+F5) и попробуй ещё раз.');
  if (mv.status !== 'lobby') throw new Error('Игра в этой комнате уже идёт');
  const res = await base.child('seats/B').transaction(cur => (cur === null ? {uid, name, joinedAt:Date.now()} : undefined));
  if (!res.committed) throw new Error('Комната уже заполнена');
  return code;
}

function Composer({seat, round, settings, receiverName, ownedIds, onSubmit}){
  const fixed = tierForRound(settings, round);
  const [tier, setTier] = useState(fixed);
  const [sel, setSel] = useState([]);
  const [tab, setTab] = useState('all');
  const [q, setQ] = useState('');
  const pool = tier ? ITEMS.filter(i => i.tier === tier) : [];
  const shown = pool.filter(i => (tab === 'all' || i.slot === tab) && matchItem(i, q));
  const toggle = id => {
    setSel(s => s.includes(id) ? s.filter(x => x !== id) : (s.length >= HIDE_COUNT ? s : [...s, id]));
  };
  const pickTier = t => { setTier(t); setSel([]); };
  return html`<div className="flex flex-col gap-4">
    <div className="flex flex-wrap items-center justify-between gap-2">
      <div>
        <div className="panel-h">Загадай ${HIDE_COUNT} предмета для: ${receiverName}</div>
        <div className="muted" style=${{fontSize:'12px'}}>Из них он выберет один вслепую. Предметы, которые у него уже есть или конфликтуют с его сборкой (улучшение или компонент уже имеющегося предмета), а при четырёх активных предметах недоступны и все остальные активные,.</div>
      </div>
      ${fixed ? html`<${TierChip} tier=${fixed}/>` : null}
    </div>
    ${!fixed ? html`<div>
      <div className="muted mb-2" style=${{fontSize:'12px'}}>Хаос: выбери тир сам. Соперник не увидит его до конца раунда.</div>
      <div className="flex flex-wrap gap-2">
        ${[1, 2, 3, 4].map(t => {
          const av = availableOfTier(t, ownedIds).length;
          return html`<button key=${t} className=${cx('tierb', tier === t && 'on')} style=${{'--tc':'var(--t' + t + ')'}} disabled=${av < HIDE_COUNT} onClick=${() => pickTier(t)}>
            <span className="tb-n">${ROMAN[t]}</span>
            <div className="disp tb-t">Тир ${t}</div>
            <div className="num tb-p"><${Soul}/> ${TIER_PRICE[t]}</div>
            <div className="tb-bar"><i style=${{width:Math.round(100 * av / Math.max(1, ITEMS.filter(i => i.tier === t).length)) + '%'}}></i></div>
            <div className="muted" style=${{fontSize:'11px'}}>доступно ${av} из ${ITEMS.filter(i => i.tier === t).length}</div>
          </button>`;
        })}
      </div>
    </div>` : null}
    ${tier ? html`<div className="flex flex-col gap-4">
      <div className="flex flex-wrap items-center gap-3">
        <div className="flex gap-2">
          ${Array.from({length:HIDE_COUNT}, (_, i) => {
            const it = sel[i] ? BY_ID[sel[i]] : null;
            return it
              ? html`<${Card} key=${i} item=${it} size="s" onClick=${() => toggle(it.id)}/>`
              : html`<div key=${i} className="trayslot" style=${{width:'78px'}}>${i + 1}</div>`;
          })}
        </div>
        <button className="btn gold" disabled=${sel.length !== HIDE_COUNT} onClick=${() => onSubmit(seat, tier, sel)}>Загадать</button>
        <span className="muted num" style=${{fontSize:'12px'}}>выбрано ${sel.length} из ${HIDE_COUNT}</span>
      </div>
      <div className="flex flex-wrap items-center justify-between gap-3">
        <${SlotTabs} value=${tab} onChange=${setTab}/>
        <div style=${{flex:'1 1 200px',maxWidth:'340px'}}><input className="fld" type="search" placeholder="Поиск: название или характеристика" aria-label="Поиск предметов" value=${q} onInput=${e => setQ(e.target.value)}/></div>
      </div>
      <div className="flex flex-wrap gap-4 justify-center" style=${{paddingBottom:'10px'}}>
        ${!shown.length ? html`<div className="muted py-6">Ничего не найдено. Попробуй другое слово или вкладку «Все предметы».</div>` : null}
        ${shown.map(it => {
          const banned = ownedIds.has(it.id);
          const picked = sel.includes(it.id);
          return html`<${Card} key=${it.id} item=${it} size="g" state=${banned ? 'banned' : (picked ? 'sel' : '')}
            tag=${banned ? 'НЕДОСТУПЕН' : (picked ? 'ВЫБРАН' : null)} onClick=${() => toggle(it.id)}/>`;
        })}
      </div>
    </div>` : null}
  </div>`;
}

/* ---------- тройки карт на столе ---------- */
function TrioRow({hider, move, pickMove, picker, names, reveal, interactive, onPick, active, phase}){
  const {descLang} = useContext(PrefCtx);
  const hidden = move && move.hide;
  const pickedIdx = pickMove ? pickMove.idx : -1;
  const taker = names[picker];
  return html`<div className=${cx('panel p-3', active && 'active')}>
    <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
      <div>
        <div className="panel-h">Карты: ${names[hider]}</div>
        <div className="muted" style=${{fontSize:'12px'}}>выбирает ${taker}</div>
      </div>
      ${active ? html`<span className="chip gold">${interactive ? 'выбери карту' : 'ожидание выбора'}</span>`
        : (pickMove ? html`<span className="chip ok">взято</span>` : (hidden ? html`<span className="chip">загадано</span>` : html`<span className="chip">загадывает…</span>`))}
    </div>
    <div className="flex justify-center gap-4" style=${{paddingBottom:'12px'}}>
      ${Array.from({length:HIDE_COUNT}, (_, i) => {
        if (!hidden) return html`<div key=${i} className="trayslot" style=${{width:'80px'}}>${i + 1}</div>`;
        const item = BY_ID[hidden[i]];
        const picked = i === pickedIdx;
        const faceUp = reveal || picked;
        const st = picked ? 'taken' : (reveal && pickMove ? 'faded' : (interactive ? 'pickable' : ''));
        return html`<${Card} key=${i} item=${item} back=${!faceUp} n=${i + 1} size="t" state=${st}
          tag=${picked ? 'ВЗЯЛ ' + SEAT_LABEL[picker] : null}
          onClick=${interactive ? (() => onPick(i)) : undefined}/>`;
      })}
    </div>
  </div>`;
}

function Stage({session, d, peek}){
  const {settings, names, moves, viewerSeats} = session;
  const r = d.round, phase = d.phase;
  const mv = s => (moves[s] && moves[s][r]) || {};
  const local = viewerSeats.length === 2;
  const [tab, setTab] = useState('A');
  const pending = viewerSeats.filter(s => !mv(s).hide);
  const active = pending.includes(tab) ? tab : pending[0];
  const picking = phase === 'pick';
  const canPick = s => picking && viewerSeats.includes(s) && !mv(s).pick;
  const showTrios = phase !== 'hide' || mv('A').hide || mv('B').hide;
  const isLast = r === settings.rounds;
  const allReady = viewerSeats.length > 0 && viewerSeats.every(s => mv(s).ready);
  const roundTier = tierForRound(settings, r);

  const revealFor = h => phase === 'recap' || (local ? peek : (viewerSeats.length === 1 && viewerSeats[0] === h));
  const trio = h => html`<${TrioRow} key=${h} hider=${h} picker=${other(h)} names=${names} phase=${phase}
      move=${mv(h)} pickMove=${mv(other(h)).pick} reveal=${revealFor(h)}
      active=${picking && !mv(other(h)).pick} interactive=${canPick(other(h))}
      onPick=${idx => session.pick(other(h), r, idx, mv(h).hide[idx])}/>`;

  return html`<div className="flex flex-col gap-3">
    <div className="panel p-3">
      <div className="flex flex-wrap items-center justify-between gap-2">
        <div className="panel-h">
          ${phase === 'hide' ? 'Загадывание' : phase === 'recap' ? 'Итог раунда' : 'Выбор карты'}
        </div>
        <div className="flex flex-wrap gap-2">
          ${roundTier ? html`<${TierChip} tier=${roundTier}/>` : html`<span className="chip gold">Хаос: тир выбирает каждый</span>`}
        </div>
      </div>
      <div className="mt-2 flex flex-wrap gap-2">
        ${['A', 'B'].map(s => html`<span key=${s} className=${cx('chip', mv(s).hide && 'ok')}>${names[s]}: ${mv(s).hide ? 'загадал ✓' : 'загадывает…'}</span>`)}
        ${phase !== 'hide' ? ['A', 'B'].map(s => html`<span key=${'p' + s} className=${cx('chip', mv(s).pick && 'ok')}>${names[s]}: ${mv(s).pick ? 'выбрал ✓' : 'ещё не выбрал'}</span>`) : null}
      </div>
    </div>

    ${phase === 'hide' && pending.length > 0 ? html`<div className="panel p-4">
      ${local && pending.length > 1 ? html`<div className="flex gap-2 mb-3">
        ${pending.map(s => html`<button key=${s} className=${cx('btn sm', active === s && 'gold')} onClick=${() => setTab(s)}>Загадывает ${names[s]}</button>`)}
      </div>` : null}
      <${Composer} key=${active + '-' + r} seat=${active} round=${r} settings=${settings}
        receiverName=${names[other(active)]} ownedIds=${ownedSet(d.inv, other(active))}
        onSubmit=${(seat, tier, ids) => session.hide(seat, r, tier, ids)}/>
    </div>` : null}

    ${phase === 'hide' && pending.length === 0 && viewerSeats.length > 0 ? html`<div className="panel p-4 text-center">
      <div className="panel-h">Твои карты загаданы</div>
      <div className="muted mt-1">Ждём, пока соперник закончит загадывание.</div>
    </div>` : null}

    ${showTrios ? html`<div className="flex flex-col gap-3">${trio('A')}${trio('B')}</div>` : null}

    ${picking ? html`<div className="panel p-3 text-center">
      <div className="disp" style=${{fontSize:'17px',color:viewerSeats.some(canPick) ? 'var(--gold2)' : 'var(--muted)'}}>
        ${viewerSeats.some(canPick) ? 'Выбери одну из трёх карт соперника (можно одновременно, порядок любой)' : 'Ждём выбор соперника…'}
      </div>
      ${local ? html`<div className="muted" style=${{fontSize:'12px'}}>Игрок называет номер карты 1, 2 или 3. Нажми на неё, она откроется и уйдёт в его инвентарь.</div>` : null}
    </div>` : null}

    ${phase === 'recap' ? html`<div className="panel p-4 flex flex-wrap items-center justify-between gap-3">
      <div>
        <div className="panel-h">Раунд ${r} завершён</div>
        <div className="muted" style=${{fontSize:'12px'}}>Все карты раскрыты. Бирюзовым отмечено, что взяли игроки.</div>
      </div>
      ${viewerSeats.length === 0 ? null : html`<button className="btn gold" disabled=${allReady}
        onClick=${() => viewerSeats.forEach(s => session.ready(s, r))}>
        ${allReady ? 'Ждём соперника…' : (isLast ? 'К итогам' : 'Следующий раунд')}
      </button>`}
    </div>` : null}
  </div>`;
}

/* ---------- итоги ---------- */
function Results({session, d, onExit}){
  const {settings, names, moves} = session;
  const sum = {A:totalSouls(d.inv.A), B:totalSouls(d.inv.B)};
  // «Баланс»: у всех одинаковые тиры, победителя по душам нет. Сайт-помощник, настоящий бой 1 на 1 идёт в игре.
  const winner = null;   // победителя сайт не объявляет: настоящий бой идёт в игре
  const offered = s => Array.from({length:settings.rounds}, (_, i) => {
    const m = moves[s] && moves[s][i + 1];
    return m && m.hide ? m.hide.reduce((a, id) => a + BY_ID[id].price, 0) : 0;
  }).reduce((a, b) => a + b, 0);
  const byTier = s => [1, 2, 3, 4].map(t => d.inv[s].filter(x => BY_ID[x.id].tier === t).length);
  const best = s => d.inv[s].map(x => BY_ID[x.id]).sort((a, b) => b.price - a.price)[0];
  const {nameLang} = useContext(PrefCtx);
  const col = s => html`<div key=${s} className=${cx('panel p-4 flex flex-col gap-4', winner === s && 'active')}>
    <div className="flex items-start justify-between gap-2">
      <div className="min-w-0">
        <div className="panel-h truncate">${names[s]}</div>
        <div className="disp num soul" style=${{fontSize:'30px',lineHeight:1.1}}><${Soul}/>${sum[s]}</div>
      </div>
      ${winner === s ? html`<span className="chip gold">Победитель</span>` : null}
    </div>
    <div className="flex flex-wrap gap-3">
      ${d.inv[s].map((x, i) => html`<${Card} key=${i} item=${BY_ID[x.id]} size="s"/>`)}
    </div>
    <hr className="rule"/>
    <div className="grid grid-cols-2 gap-3" style=${{fontSize:'13px'}}>
      <div><div className="muted">Средняя цена предмета</div><div className="num disp" style=${{fontSize:'18px'}}>${d.inv[s].length ? Math.round(sum[s] / d.inv[s].length) : 0}</div></div>
      <div><div className="muted">Предложил сопернику</div><div className="num disp" style=${{fontSize:'18px'}}><${Soul}/>${offered(s)}</div></div>
      <div><div className="muted">Лучшая находка</div><div style=${{fontWeight:600}}>${best(s) ? html`<span className="inl"><${ItemIcon} item=${best(s)} size=${26}/>${best(s).name[nameLang]}</span>` : '-'}</div></div>
      <div><div className="muted">Тиры 1 / 2 / 3 / 4</div><div className="num disp" style=${{fontSize:'18px'}}>${byTier(s).join(' / ')}</div></div>
    </div>
  </div>`;
  return html`<div className="flex flex-col gap-4">
    <div className=${cx('panel p-6 text-center', winner && 'winner')}>
      <div className="muted disp" style=${{fontSize:'12px'}}>Итоги · ${settings.rounds} раундов · ${settings.mode === 'balance' ? 'Баланс' : 'Хаос'}</div>
      <div className="disp" style=${{fontSize:'clamp(26px,5vw,44px)',color:'var(--gold2)'}}>
        ${winner ? 'Победил ' + names[winner] : 'Драфт завершён'}
      </div>
      ${winner ? null : html`<div className="muted mt-1" style=${{fontSize:'14px'}}>Предметы выбраны. Удачи!</div>`}
      <div className="muted num mt-1">${names.A} <${Soul}/>${sum.A} · ${names.B} <${Soul}/>${sum.B}${winner ? html` · разница <${Soul}/>${Math.abs(sum.A - sum.B)}` : ''}</div>
      <div className="mt-4"><button className="btn gold" onClick=${onExit}>Играть снова</button></div>
    </div>
    <div className="grid gap-4 md:grid-cols-2">${col('A')}${col('B')}</div>
    <div className="panel p-4">
      <div className="panel-h mb-2">Ход игры</div>
      <div style=${{overflowX:'auto'}}>
        <table className="rt">
          <thead><tr><th>Раунд</th><th>${names.A} получил</th><th>${names.B} получил</th><th>${names.A} загадал</th><th>${names.B} загадал</th></tr></thead>
          <tbody>
            ${Array.from({length:settings.rounds}, (_, i) => {
              const a = moves.A[i + 1] || {}, b = moves.B[i + 1] || {};
              const cell = m => m.pick ? html`<span className="inl"><${ItemIcon} item=${BY_ID[m.pick.id]} size=${22}/>${BY_ID[m.pick.id].name[nameLang]}</span>` : '-';
              const off = m => m.hide ? html`<span className="tchip" style=${{'--tc':'var(--t' + m.tier + ')'}}>Т${m.tier}</span>` : '-';
              return html`<tr key=${i}><td className="num">${i + 1}</td><td>${cell(a)}</td><td>${cell(b)}</td><td>${off(a)}</td><td>${off(b)}</td></tr>`;
            })}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

/* ---------- игровое поле ---------- */
function GameView({session, onExit}){
  const {settings, names, moves, viewerSeats} = session;
  const d = useMemo(() => derive(settings, moves), [settings, moves]);
  const [peek, setPeek] = useState(false);
  const [sure, setSure] = useState(false);
  useEffect(() => { if (!sure) return; const t = setTimeout(() => setSure(false), 3500); return () => clearTimeout(t); }, [sure]);
  const local = viewerSeats.length === 2;
  if (d.finished) return html`<${Results} session=${session} d=${d} onExit=${onExit}/>`;
  const pickingNow = s => d.phase === 'pick' && !(moves[s] && moves[s][d.round] && moves[s][d.round].pick);
  const hideAct = s => d.phase === 'hide' && !(moves[s] && moves[s][d.round] && moves[s][d.round].hide);
  const steps = [['hide', 'Загадывание'], ['pick', 'Выбор карт (в любом порядке)'], ['recap', 'Итог раунда']];
  const idx = steps.findIndex(s => s[0] === d.phase);
  return html`<div className="flex flex-col gap-3">
    <div className="panel p-3">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-baseline gap-3">
          <div className="disp" style=${{fontSize:'26px',color:'var(--gold2)'}}>Раунд <span className="num">${d.round}</span> / <span className="num">${settings.rounds}</span></div>
          <span className="chip">${settings.mode === 'balance' ? 'Баланс' : 'Хаос'}</span>
          ${session.kind === 'online' ? html`<span className="chip">комната ${session.meta.code}</span>` : html`<span className="chip">локально</span>`}
        </div>
        <div className="flex flex-wrap items-center gap-2">
          ${local ? html`<label className="chip" style=${{cursor:'pointer'}}><input type="checkbox" checked=${peek} onChange=${e => setPeek(e.target.checked)}/> показывать скрытые карты</label>` : null}
          <button className=${cx('btn sm danger')} onClick=${() => sure ? onExit() : setSure(true)}>${sure ? 'Точно выйти?' : 'Выйти'}</button>
        </div>
      </div>
      <div className="pbar mt-3">${Array.from({length:settings.rounds}, (_, i) => html`<i key=${i} className=${i + 1 < d.round ? 'done' : (i + 1 === d.round ? 'cur' : '')}></i>`)}</div>
      <div className="stepper mt-2">
        ${steps.map((s, i) => html`<div key=${s[0]} className=${cx('step', i === idx && 'on', i < idx && 'done')}>${s[1]}</div>`)}
      </div>
    </div>
    ${session.wErr ? html`<div className="panel p-3" style=${{borderColor:'var(--red)'}}>${session.wErr} <button className="btn sm ml-2" onClick=${session.clearErr}>Скрыть</button></div>` : null}
    <div className="grid gap-3 grid-cols-2 lg:grid-cols-[minmax(230px,1fr)_minmax(0,1.9fr)_minmax(230px,1fr)] items-start">
      <div className="col-span-2 lg:col-span-1 lg:order-2" style=${{minWidth:0}}><${Stage} session=${session} d=${d} peek=${peek}/></div>
      <div className="lg:order-1" style=${{minWidth:0}}><${Inventory} seat="A" name=${names.A} list=${d.inv.A} curRound=${d.round}
        active=${pickingNow('A') || hideAct('A')} you=${!local && viewerSeats[0] === 'A'}/></div>
      <div className="lg:order-3" style=${{minWidth:0}}><${Inventory} seat="B" name=${names.B} list=${d.inv.B} curRound=${d.round}
        active=${pickingNow('B') || hideAct('B')} you=${!local && viewerSeats[0] === 'B'}/></div>
    </div>
  </div>`;
}

/* ---------- онлайн-комната ---------- */
function useDebouncedFn(fn, ms){
  const t = useRef(null); const f = useRef(fn); f.current = fn;
  return useCallback((...a) => { clearTimeout(t.current); t.current = setTimeout(() => f.current(...a), ms); }, [ms]);
}
function RoomLobby({session, onLeave, canWrite}){
  const {meta, seats, mySeat} = session;
  const isHost = mySeat === 'A';
  const [cfg, setCfg] = useState({rounds:meta.rounds, mode:meta.mode, order:meta.order});
  const [copied, setCopied] = useState(false);
  const save = useDebouncedFn(c => session.updateMeta(c), 350);
  const view = isHost ? cfg : {rounds:meta.rounds, mode:meta.mode, order:meta.order};
  const change = c => { setCfg(c); save(c); };
  const bIn = !!(seats.B && seats.B.uid);
  return html`<div className="mx-auto flex flex-col gap-4" style=${{maxWidth:'1180px'}}>
    <div className="panel p-5 text-center">
      <div className="muted disp" style=${{fontSize:'12px'}}>Код комнаты</div>
      <div className="disp num" style=${{fontSize:'clamp(40px,10vw,64px)',color:'var(--gold2)',letterSpacing:'.2em'}}>${meta.code}</div>
      <div className="flex justify-center gap-2 mt-2">
        <button className="btn sm" onClick=${() => copyText(meta.code).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1500); }).catch(() => {})}>${copied ? 'Скопировано' : 'Скопировать код'}</button>
        <button className="btn sm danger" onClick=${onLeave}>Выйти</button>
      </div>
      <p className="muted mt-3" style=${{fontSize:'13px'}}>Отправь код другу. Он открывает этот же сайт, выбирает «Онлайн» и вводит код.</p>
    </div>
    <div className="panel p-4 flex flex-wrap gap-3 justify-between items-center">
      <span className=${cx('chip', 'ok')}>Игрок А: ${(seats.A && seats.A.name) || '...'} ✓</span>
      <span className=${cx('chip', bIn && 'ok')}>Игрок Б: ${bIn ? seats.B.name + ' ✓' : 'ждём подключения…'}</span>
    </div>
    <div className="panel p-5">
      <div className="flex items-center justify-between mb-4">
        <div className="panel-h">Настройки игры</div>
        ${!isHost ? html`<span className="chip">настраивает хост</span>` : null}
      </div>
      <${SettingsPanel} cfg=${view} setCfg=${change} readOnly=${!isHost}/>
    </div>
    ${isHost ? html`<div className="text-center">
      <button className="btn gold" style=${{fontSize:'17px',padding:'14px 34px'}} disabled=${!bIn || canWrite === false}
        onClick=${() => session.updateMeta({status:'playing', ...cfg})}>Начать игру</button>
      ${!bIn ? html`<div className="muted mt-2" style=${{fontSize:'12px'}}>Кнопка включится, когда подключится Игрок Б.</div>` : null}
    </div>` : html`<div className="text-center muted">Ждём, пока хост начнёт игру…</div>`}
  </div>`;
}
function OnlineRoom({db, uid, code, canWrite, onLeave}){
  const s = useOnlineSession(db, uid, code);
  if (s.error) return html`<div className="panel p-5 text-center mx-auto" style=${{maxWidth:'520px'}}>
    <div className="panel-h">Нет связи с комнатой</div><p className="muted mt-2">${s.error}</p><button className="btn mt-3" onClick=${onLeave}>В лобби</button></div>`;
  if (!s.room.loaded) return html`<div className="panel p-5 text-center mx-auto" style=${{maxWidth:'520px'}}>
    <div className="panel-h">Подключаемся к комнате ${code}…</div>
    ${s.room.slow ? html`<p className="muted mt-2">Ответ идёт дольше обычного. Данные могут быть недоступны, пока сеть не ответит.</p>` : null}
    <button className="btn sm mt-3" onClick=${onLeave}>Отмена</button></div>`;

    return html`<${RoomLobby} session=${s} onLeave=${onLeave} canWrite=${canWrite}/>`;

/* ======================= МУЗЫКА (генерируется прямо в браузере, без файлов) =======================
   Настоящие саундтреки Deadlock мы не вшиваем (авторские права). Свои mp3 можно добавить в FILE_TRACKS: {id:'my', name:'Мой трек', src:'music/my.mp3'}. */
const FILE_TRACKS = [];
const THEMES = [
  {id:'gold', name:'Золотой нуар', sw:'#e0c58a'}, {id:'sapphire', name:'Сапфировое пламя', sw:'#5f93b8'},
  {id:'crimson', name:'Багровый', sw:'#c05a5a'}, {id:'jade', name:'Нефрит', sw:'#5ab88c'}, {id:'violet', name:'Спиритизм', sw:'#9a62d6'}
];
// Звуки меняются вместе с темой. tick/bid: [f1, f2, длительность, форма, громкость]; gavel: [f1, f2, длительность, форма, громкость, шум]
const SFX_BANK = {
  gold:{tick:[520, 420, .05, 'sine', .05], bid:[880, 1320, .1, 'sine', .08], gavel:[170, 60, .24, 'sine', .26, .08]},
  sapphire:{tick:[1250, 1000, .07, 'sine', .04], bid:[1568, 2093, .14, 'sine', .06], gavel:[420, 220, .3, 'triangle', .14, .04]},
  crimson:{tick:[190, 120, .07, 'triangle', .07], bid:[220, 330, .12, 'triangle', .1], gavel:[110, 45, .34, 'sine', .32, .1]},
  jade:{tick:[700, 900, .05, 'sine', .05], bid:[523, 784, .11, 'sine', .08], gavel:[300, 190, .2, 'sine', .2, .05]},
  violet:{tick:[760, 1050, .08, 'sine', .04], bid:[659, 988, .16, 'sine', .07], gavel:[130, 95, .55, 'sine', .22, .03]}
};
const Sfx = (() => {
  let ctx = null, out = null, on = true, theme = 'gold';
  const C = () => {
    if (!ctx){
      const A = window.AudioContext || window.webkitAudioContext; if (!A) return null;
      ctx = new A(); const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
      out = ctx.createGain(); out.gain.value = .9; out.connect(lp); lp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  const tone = (c, f0, f1, t0, dur, type, g) => {
    const o = c.createOscillator(), e = c.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    e.gain.setValueAtTime(0.0001, t0); e.gain.linearRampToValueAtTime(g, t0 + .008); e.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(e); e.connect(out); o.start(t0); o.stop(t0 + dur + .03);
  };
  const noise = (c, t0, dur, g) => {
    const n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), e = c.createGain(); f.type = 'lowpass'; f.frequency.value = 900; src.buffer = b; e.gain.value = g;
    src.connect(f); f.connect(e); e.connect(out); src.start(t0);
  };
  return {
    setOn(v){ on = v; }, setTheme(t){ theme = SFX_BANK[t] ? t : 'gold'; },
    play(kind){
      if (!on) return; const c = C(); if (!c) return; const t = c.currentTime, b = SFX_BANK[theme][kind]; if (!b) return;
      if (kind === 'tick') tone(c, b[0], b[1], t, b[2], b[3], b[4]);
      else if (kind === 'bid'){ tone(c, b[0], b[0], t, b[2], b[3], b[4]); tone(c, b[1], b[1], t + b[2] * .8, b[2] * 1.3, b[3], b[4]); }
      else if (kind === 'gavel'){ tone(c, b[0], b[1], t, b[2], b[3], b[4]); noise(c, t, .08, b[5]); }
    }
  };
})();
const GEN_TRACKS = [
  {id:'noir', name:'Ночной нуар', bpm:66, root:45, wave:'triangle', chord:[0,3,7,10], prog:[0,5,3,7], arp:false},
  {id:'neon', name:'Неоновый дрейф', bpm:84, root:40, wave:'sawtooth', chord:[0,3,7,12], prog:[0,8,5,10], arp:true},
  {id:'rain', name:'Дождь над городом', bpm:54, root:38, wave:'sine', chord:[0,4,7,11], prog:[0,3,8,5], arp:true}
];
const YT_TRACK = {id:'yt', name:'Саундтрек Deadlock (YouTube)', yt:'PLk-l3guipFR5uDKFKGSV1nSubOWLIslor'};
const ALL_TRACKS = [YT_TRACK].concat(GEN_TRACKS, FILE_TRACKS);
const PREF_DEF = {nameLang:'en', descLang:'ru', musicOn:false, vol:.35, track:'yt', anim:true, sfx:true, theme:'gold'};
const Music = (() => {
  let ctx = null, master = null, timer = null, cur = null, vol = .35, step = 0, next = 0, audio = null, yt = null, ytWait = false;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const ensure = () => {
    if (!ctx){
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return false;
      ctx = new C(); master = ctx.createGain(); master.gain.value = vol;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500;
      master.connect(lp); lp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return true;
  };
  const note = (m, t, dur, type, g) => {
    const o = ctx.createOscillator(), e = ctx.createGain(); o.type = type; o.frequency.value = mtof(m);
    e.gain.setValueAtTime(0.0001, t); e.gain.linearRampToValueAtTime(g, t + Math.min(.5, dur / 3)); e.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(e); e.connect(master); o.start(t); o.stop(t + dur + .05);
  };
  const tick = () => {
    const T = cur, beat = 60 / T.bpm;
    while (next < ctx.currentTime + .6){
      const b = step % 8, ch = T.prog[Math.floor(step / 8) % T.prog.length];
      if (b === 0){ T.chord.forEach(iv => note(T.root + 12 + ch + iv, next, beat * 4.2, T.wave, .045)); note(T.root + ch, next, beat * 3.6, 'sine', .14); }
      if (b === 4) note(T.root + ch, next, beat * 2.5, 'sine', .09);
      if (T.arp && b % 2 === 0) note(T.root + 24 + ch + T.chord[(b / 2 + Math.floor(step / 8)) % T.chord.length], next, beat * 1.2, 'triangle', .035);
      if (!T.arp && b === 6) note(T.root + 31 + ch, next, beat * 2, 'sine', .03);
      next += beat / 2; step++;
    }
  };
  // Плейлист играет через официальный встроенный плеер YouTube (файлы мы не копируем и не храним).
  const playYT = t => {
    if (yt && yt.playVideo){ yt.setVolume(vol * 100); yt.playVideo(); return; }
    if (ytWait) return; ytWait = true;
    const boot = () => {
      const d = document.createElement('div'); d.style.cssText = 'position:fixed;left:-9999px;top:0;width:220px;height:140px;overflow:hidden';
      const inner = document.createElement('div'); d.appendChild(inner); document.body.appendChild(d);
      yt = new window.YT.Player(inner, {width:220, height:140, playerVars:{listType:'playlist', list:t.yt, autoplay:1, loop:1, playsinline:1},
        events:{onReady:e => { e.target.setVolume(vol * 100); e.target.playVideo(); }, onError:() => { try { yt.nextVideo(); } catch (e){} }}});
    };
    if (window.YT && window.YT.Player) boot();
    else { window.onYouTubeIframeAPIReady = boot; const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(sc); }
  };
  const stopAll = () => {
    if (timer){ clearInterval(timer); timer = null; }
    if (audio){ audio.pause(); audio = null; }
    if (yt && yt.pauseVideo){ try { yt.pauseVideo(); } catch (e){} }
    cur = null;
  };
  return {
    play(id, v){
      vol = v; const t = ALL_TRACKS.find(x => x.id === id) || ALL_TRACKS[0];
      if (cur === t && (timer || audio || (t.yt && yt))){ if (t.yt && yt && yt.playVideo) yt.playVideo(); else if (ctx && ctx.state === 'suspended') ctx.resume(); return; }
      stopAll(); cur = t;
      if (t.yt){ playYT(t); return; }
      if (t.src){ audio = new Audio(t.src); audio.loop = true; audio.volume = vol; audio.play().catch(() => {}); return; }
      if (!ensure()) return;
      master.gain.value = vol; step = 0; next = ctx.currentTime + .1; timer = setInterval(tick, 200); tick();
    },
    stop(){ stopAll(); },
    vol(v){ vol = v; if (master) master.gain.value = v; if (audio) audio.volume = v; if (yt && yt.setVolume) yt.setVolume(v * 100); },
    skip(d){ if (yt && yt.nextVideo){ try { d > 0 ? yt.nextVideo() : yt.previousVideo(); } catch (e){} } }
  };
})();

const otherSeat = x => (x === 'A' ? 'B' : 'A');
function auInit(cfg, seats, first = 'A'){
  return {cfg, ver:CAT_VER, seats, phase:seats.B ? 'nominate' : 'lobby', round:1, first, nominator:first, item:'', turn:'', deadline:0, bid:{amount:0, by:''}, money:{A:cfg.budget, B:cfg.budget}, won:{A:[], B:[]}, log:[]};

// Одна функция правил: работает и на одном экране, и в онлайне (транзакция Firebase).
function auReduce(st, a){
  if (!st) return st;
  const s = {...st, money:{...st.money}, won:{A:[...((st.won && st.won.A) || [])], B:[...((st.won && st.won.B) || [])]}, log:[...(st.log || [])]};
  const bid = st.bid || {amount:0, by:''}, tm = (st.cfg && st.cfg.timer) || 0;
  const settle = () => {
    const winner = bid.by || s.nominator, price = bid.by ? bid.amount : 0;
    s.won[winner].push({id:s.item, price, round:s.round}); s.money[winner] -= price;
    s.log.push({round:s.round, id:s.item, winner, price});
    if (s.round >= s.cfg.rounds) s.phase = 'done'; else { s.round++; s.nominator = otherSeat(s.nominator); s.phase = 'nominate'; }
    s.item = ''; s.turn = ''; s.deadline = 0; s.bid = {amount:0, by:''}; return s;
  };
  if (a.t === 'rematch'){ return st.phase === 'done' ? auInit(st.cfg, st.seats, otherSeat(st.first || 'A')) : st; }
  if (a.t === 'nominate'){
    if (s.phase !== 'nominate' || a.seat !== s.nominator) return st;
    if (s.won.A.concat(s.won.B).some(w => w.id === a.id)) return st;
    if (blockedSet(s.won[a.seat].map(w => w.id)).has(a.id)) return st;   // выставлять можно только то, что сам можешь взять
    s.phase = 'bid'; s.item = a.id; s.turn = otherSeat(a.seat); s.bid = {amount:0, by:''}; s.deadline = tm ? (a.now || 0) + tm * 1000 : 0; return s;
  }
  if (a.t === 'bid'){
    const n = Math.floor(Number(a.amount));
    if (s.phase !== 'bid' || a.seat !== s.turn || !(n > bid.amount) || n > s.money[a.seat]) return st;
    if (blockedSet(s.won[a.seat].map(w => w.id)).has(s.item)) return st;   // предмет конфликтует со сборкой: только пас
    s.bid = {amount:n, by:a.seat}; s.turn = otherSeat(a.seat); s.deadline = tm ? (a.now || 0) + tm * 1000 : 0; return s;
  }
  if (a.t === 'pass'){ if (s.phase !== 'bid' || a.seat !== s.turn) return st; return settle(); }
  if (a.t === 'timeout'){ if (s.phase !== 'bid' || !s.deadline || !(a.now >= s.deadline)) return st; return settle(); }
  return st;
}

    try {
      for (let i = 0; i < 6; i++){
        const c = genCode();
        const res = await fbDb.ref('auctions/' + c + '/state').transaction(cur => (cur === null ? auInit(cfg, {A:{uid, name:nm(nick)}}) : undefined));
        if (res.committed){ store.set('bd_aroom', c); setCode(c); setBusy(false); return; }
      }
      throw new Error('Не удалось создать комнату, попробуй ещё раз');
    } catch (e){ setErr(e.message); }
    setBusy(false);
  };
  const joinRoom = async () => {
    setBusy(true); setErr(null);
    try {
      const c = join.trim().toUpperCase(); if (c.length < 4) throw new Error('Введи код комнаты');
      const pre = (await fbDb.ref('auctions/' + c + '/state/ver').once('value')).val();
      if (pre && CAT_VER && pre !== CAT_VER) throw new Error('У вас разные версии каталога предметов (у хоста ' + pre + ', у тебя ' + CAT_VER + '). Обнови страницу (Ctrl+F5) и попробуй ещё раз.');
      const res = await fbDb.ref('auctions/' + c + '/state').transaction(cur => {
        if (!cur) return undefined;
        if ((cur.seats.A && cur.seats.A.uid === uid) || (cur.seats.B && cur.seats.B.uid === uid)) return cur;
        if (cur.seats.B) return undefined;
        return {...cur, seats:{...cur.seats, B:{uid, name:nm(nick)}}, phase:'nominate'};
      });
      if (!res.committed) throw new Error('Комната не найдена или уже заполнена');
      store.set('bd_aroom', c); setCode(c);
    } catch (e){ setErr(e.message); }
    setBusy(false);
  };
  const leave = () => { store.set('bd_aroom', null); setCode(null); setOnline(undefined); setLocal(null); setMode(null); };
  if (mode === 'local' && local) return html`<${AuctionBoard} st=${local} controls=${['A', 'B']} dispatch=${a => setLocal(x => auReduce(x, a))} onExit=${leave}/>`;
  if (code){
    if (online === undefined) return html`<div className="panel p-6 text-center"><div className="spin"></div><p className="muted mt-3">Подключаемся к комнате…</p></div>`;
    if (online === null) return html`<div className="panel p-6 text-center"><p>Комната не найдена.</p>${err ? html`<pre className="err">${err}</pre>` : null}<button className="btn mt-3" onClick=${leave}>Назад</button></div>`;
    const my = online.seats.A && online.seats.A.uid === uid ? 'A' : (online.seats.B && online.seats.B.uid === uid ? 'B' : null);
    return html`<div className="flex flex-col gap-4">
      <div className="panel p-3 flex flex-wrap items-center justify-between gap-2"><span>Комната <b className="disp" style=${{color:'var(--gold2)',letterSpacing:'.2em'}}>${code}</b>${online.phase === 'lobby' ? html` · отправь этот код другу` : ''}</span><button className="btn sm" onClick=${() => { copyText(code); }}>Копировать код</button><button className="btn sm" onClick=${() => { copyText(location.origin + location.pathname + '#auction-' + code); }}>Копировать ссылку-приглашение</button><button className="btn sm danger" onClick=${leave}>Выйти</button></div>
      ${err ? html`<pre className="err">${err}</pre>` : null}
      <${AuctionBoard} st=${online} controls=${my ? [my] : []} dispatch=${dispatchOnline} onExit=${leave}/>
    </div>`;
  }
  return html`<div className="flex flex-col gap-5">
    <div className="hero text-center"><h2 className="hero-t" style=${{fontSize:'clamp(30px,6vw,52px)'}}>Чёрный аукцион</h2>
      <p className="muted" style=${{maxWidth:'60ch',margin:'0 auto'}}>Игрок А выставляет предмет, Б делает первую ставку, потом вы перебиваете друг друга. Кто спасовал, тот остаётся без предмета. Потом выставляет Б.</p></div>
    <div className="grid gap-4 md:grid-cols-2">
      <div className="panel p-5 flex flex-col gap-4">
        <div className="panel-h">Настройки торгов</div>
        <div><div className="flex justify-between"><span>Бюджет у каждого</span><b className="disp num">${'$' + cfg.budget}</b></div><input type="range" min="20" max="500" step="10" value=${cfg.budget} onChange=${e => setCfg({...cfg, budget:Number(e.target.value)})}/></div>
        <div><div className="flex justify-between"><span>Предметов в торгах</span><b className="disp num">${cfg.rounds}</b></div><input type="range" min="2" max="12" step="2" value=${cfg.rounds} onChange=${e => setCfg({...cfg, rounds:Number(e.target.value)})}/></div>
        <div><div className="flex justify-between items-center"><span>Время на ставку</span><${Seg} value=${cfg.timer} options=${[{v:0, l:'Выкл'}, {v:15, l:'15 с'}, {v:30, l:'30 с'}, {v:60, l:'60 с'}]} onChange=${v => setCfg({...cfg, timer:v})}/></div></div>
        <button className="btn gold" onClick=${() => { setLocal(auInit(cfg, {A:{name:'Игрок А'}, B:{name:'Игрок Б'}})); setMode('local'); }}>Играть на одном экране</button>
      </div>
      <div className="panel p-5 flex flex-col gap-3">
        <div className="panel-h">Онлайн с другом</div>
        ${hashRoom() ? html`<div className="chip gold" style=${{whiteSpace:'normal'}}>Тебя пригласили в комнату ${hashRoom()}. Введи ник и нажми «Войти».</div>` : null}
        <input className="fld" placeholder="Твой ник" maxLength="20" value=${nick} onChange=${e => { setNick(e.target.value); store.set('bd_nick', e.target.value); }}/>
        <button className="btn gold" disabled=${busy || !fbDb} onClick=${create}>Создать комнату</button>
        <div className="flex gap-2"><input className="fld" placeholder="Код комнаты" maxLength="6" value=${join} onChange=${e => setJoin(e.target.value)}/><button className="btn" disabled=${busy || !fbDb} onClick=${joinRoom}>Войти</button></div>
        ${err ? html`<pre className="err">${err}</pre>` : null}
      </div>
    </div>
  </div>`;
}
function Footer(){
  return html`<footer className="panel foot">
    <div lang="ru"><b>Неофициальный фанатский проект</b>Игра никак не связана с Valve Corporation и не одобрена ею. Deadlock, названия и иконки предметов и другие материалы игры принадлежат Valve Corporation, все права на них сохраняются за Valve. Проект некоммерческий. Данные о предметах загружаются из сообщества Deadlock API.</div>
    <div lang="en"><b>Unofficial fan project</b>Not affiliated with, endorsed by or sponsored by Valve Corporation. Deadlock, its item names, icons and other game assets are the property of Valve Corporation; all rights to them remain with Valve. This is a non-commercial project. Item data is loaded from the community Deadlock API.</div>
  </footer>`;
}

/* ---------- вкладки слотов ---------- */
const TABS = [['all', 'Все предметы', '#c9c3b4'], ['weapon', 'Оружие', 'var(--s-weapon)'], ['spirit', 'Спиритизм', 'var(--s-spirit)'], ['vitality', 'Живучесть', 'var(--s-vitality)']];
function SlotGlyph({k}){
  const g = {
    all: html`<g fill="currentColor">${[4, 10, 16].flatMap(y => [4, 10, 16].map(x => html`<rect key=${x + '-' + y} x=${x} y=${y} width="4" height="4"/>`))}</g>`,
    weapon: html`<g><g fill="none" stroke="currentColor" strokeWidth="2.4"><circle cx="12" cy="12" r="6.5"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></g><circle cx="12" cy="12" r="2" fill="currentColor"/></g>`,
    spirit: html`<path fill="currentColor" d="M12 2.5l2.7 6.3 6.8.6-5.2 4.5 1.6 6.6L12 16.9 6.1 20.5l1.6-6.6L2.5 9.4l6.8-.6z"/>`,
    vitality: html`<path fill="currentColor" d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>`
  };
  return html`<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">${g[k]}</svg>`;
}
function SlotTabs({value, onChange}){
  return html`<div className="tabs" role="group" aria-label="Раздел предметов">
    ${TABS.map(([k, l, c]) => html`<button key=${k} className=${cx('tab', value === k && 'on')} style=${{'--tc':c}} title=${l} aria-label=${l} aria-pressed=${value === k} onClick=${() => onChange(k)}><${SlotGlyph} k=${k}/><span className="tl">${l}</span></button>`)}
  </div>`;
}

/* ---------- приложение ---------- */
function App(){
  const [prefs, setPrefsS] = useState(() => ({...PREF_DEF, ...store.get('bd_prefs2', {})}));
  const setPrefs = p => { setPrefsS(p); store.set('bd_prefs2', p); };
  const [showSet, setShowSet] = useState(false), [showRules, setShowRules] = useState(false);
  useEffect(() => { if (prefs.musicOn) Music.play(prefs.track, prefs.vol); else Music.stop(); }, [prefs.musicOn, prefs.track]);
  useEffect(() => { Music.vol(prefs.vol); }, [prefs.vol]);
  useEffect(() => {
    if (!prefs.musicOn) return;
    const h = () => Music.play(prefs.track, prefs.vol);
    window.addEventListener('pointerdown', h, {once:true});
    return () => window.removeEventListener('pointerdown', h);
  }, [prefs.musicOn, prefs.track]);
  useEffect(() => { document.body.classList.toggle('no-anim', prefs.anim === false); }, [prefs.anim]);
  useEffect(() => { Sfx.setOn(prefs.sfx !== false); }, [prefs.sfx]);
  useEffect(() => { document.documentElement.setAttribute('data-theme', prefs.theme || 'gold'); Sfx.setTheme(prefs.theme || 'gold'); }, [prefs.theme]);
  useEffect(() => { const h = e => { if (e.target.closest && e.target.closest('.card:not(.banned)')) Sfx.play('tick'); }; document.addEventListener('click', h, true); return () => document.removeEventListener('click', h, true); }, []);
  const [conn, setConn] = useState('online');
  const [cfg, setCfg] = useState({rounds:8, mode:'balance', order:'ramp'});
  const [names, setNames] = useState({A:'Игрок А', B:'Игрок Б'});
  const [roomCode0] = useState(() => store.get('bd_room', null));
  const [game, setGame] = useState(() => gameFromHash(location.hash) || (roomCode0 ? 'draft' : null));
  useEffect(() => { const h = () => setGame(gameFromHash(location.hash)); window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h); }, []);
  const openGame = g => { location.hash = g ? '#' + g : ''; setGame(g); };
  const [localRun, setLocalRun] = useState(null);
  const [roomCode, setRoomCode] = useState(() => store.get('bd_room', null));
  const [dbh] = useState(() => ({status:fbDb ? 'ready' : 'off', db:fbDb, uid:getUid(), canWrite:true}));
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [cat, setCat] = useState({status:'loading'});
  const loadCat = useCallback(async () => {
    setCat({status:'loading'});
    try {
      const items = await loadCatalog();
      setCatalog(items); store.set('bd_catalog', {v:3, t:Date.now(), items});
      setCat({status:'ready', stale:false});
    } catch (e){
      const c0 = store.get('bd_catalog', null), c = c0 && c0.v === 3 ? c0 : null;       // API лежит, но есть копия с прошлого раза
      if (c && Array.isArray(c.items) && c.items.length >= 24){ setCatalog(c.items); setCat({status:'ready', stale:true, t:c.t}); }
      else setCat({status:'error', err:(e && e.message) || 'Неизвестная ошибка'});
    }
  }, []);
  useEffect(() => { loadCat(); }, []);

  useEffect(() => { if (dbh.status === 'ready' && roomCode) setConn('online'); }, [dbh.status]);

  const leaveRoom = () => { store.set('bd_room', null); setRoomCode(null); setError(null); };
  const create = async name => {
    setBusy(true); setError(null);
    try { const c = await createRoom(dbh.db, dbh.uid, name, cfg); store.set('bd_room', c); setRoomCode(c); }
    catch(e){ setError((e && e.message) || 'Не удалось создать комнату'); }
    setBusy(false);
  };
  const join = async (code, name) => {
    setBusy(true); setError(null);
    try { const c = await joinRoom(dbh.db, dbh.uid, code, name); store.set('bd_room', c); setRoomCode(c); }
    catch(e){ setError((e && e.message) || 'Не удалось войти в комнату'); }
    setBusy(false);
  };

  let body;
  if (!game) body = html`<${Hub} onOpen=${openGame}/>`;
  else if (cat.status === 'loading') body = html`<${CatalogLoading}/>`;
  else if (cat.status === 'error') body = html`<${CatalogError} err=${cat.err} onRetry=${loadCat}/>`;
  else if (game === 'auction') body = html`<${Auction}/>`;
  else if (localRun) body = html`<${LocalGame} run=${localRun} onExit=${() => setLocalRun(null)}/>`;
  else if (roomCode && dbh.status === 'ready') body = html`<${OnlineRoom} db=${dbh.db} uid=${dbh.uid} code=${roomCode} canWrite=${dbh.canWrite} onLeave=${leaveRoom}/>`;
  else body = html`<${Lobby} cfg=${cfg} setCfg=${setCfg} names=${names} setNames=${setNames} conn=${conn} setConn=${setConn} dbh=${dbh}
      onStartLocal=${() => setLocalRun({cfg:{...cfg}, names:{A:names.A.trim() || 'Игрок А', B:names.B.trim() || 'Игрок Б'}})}
      onCreate=${create} onJoin=${join} busy=${busy} error=${error}/>`;

  return html`<${PrefCtx.Provider} value=${prefs}><${TipHost}>
    <div className="shell">
      ${showRules ? html`<${RulesModal} onClose=${() => setShowRules(false)}/>` : null}
      ${showSet ? html`<${SettingsModal} prefs=${prefs} setPrefs=${setPrefs} onClose=${() => setShowSet(false)}/>` : null}
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <button className="brand" style=${{background:'none',border:0,cursor:'pointer',padding:0}} onClick=${() => openGame(null)} title="К выбору игры"><${Soul} size=${18}/>Deadlock Minigames${game ? html`<span className="muted" style=${{fontSize:'14px',fontWeight:400}}> / ${GAME_NAME[game]}</span>` : null}</button>
        <span className="flex gap-2"><button className="gear" onClick=${() => setShowRules(true)} aria-label="Правила" title="Правила" style=${{fontFamily:'var(--f-head)',fontWeight:800,fontSize:'18px'}}>?</button><button className="gear" onClick=${() => setShowSet(true)} aria-label="Настройки" title="Настройки"><${GearIcon}/></button></span>
      </div>
      ${cat.stale ? html`<div className="panel p-3 mb-3 flex flex-wrap items-center justify-between gap-2"><span className="muted" style=${{fontSize:'13px'}}>Не удалось обновить каталог. Используется сохранённая копия от ${new Date(cat.t).toLocaleDateString('ru-RU')}.</span><button className="btn sm" onClick=${loadCat}>Обновить</button></div>` : null}
      ${body}
      <p className="muted text-center mt-8" style=${{fontSize:'12px'}}>Весь сайт сделан с помощью искусственного интеллекта, поэтому описания предметов могут не совпадать с игрой (было лень проверять каждый предмет).<br/>This whole site was made with the help of AI, so item descriptions may not match the game (I was too lazy to check every item).</p>
      <${Footer}/>
    </div>
  <//><//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
