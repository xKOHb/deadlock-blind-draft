<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Слепой драфт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@400;500;600;700&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
/* Layout: three-column MOBA board. Inventory A | draft stage | inventory B. On phones the stage comes first and the inventories sit side by side underneath. Single dark look on purpose. */
:root{
  --bg:#080a0f; --bg2:#0d1017; --panel:#121620; --panel2:#181e2b; --edge:#283042; --edge2:#3a455c;
  --text:#ebe8e0; --muted:#8d97ab; --gold:#e2ab3d; --gold2:#ffd57a; --goldDim:#6f5421;
  --teal:#43c0b0; --red:#e5575c; --soul:#74b9ff;
  --t1:#9aa8bf; --t2:#58bd83; --t3:#a982f2; --t4:#f2b240;
  --f-display:'Oswald','Arial Narrow',sans-serif; --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{
  margin:0; color:var(--text); font-family:var(--f-body); font-size:14px; line-height:1.45;
  background-color:var(--bg);
  background-image:radial-gradient(1100px 520px at 50% -120px, rgba(226,171,61,.10), transparent 70%), radial-gradient(800px 500px at 100% 100%, rgba(67,192,176,.06), transparent 70%);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 40px;
}
*{box-sizing:border-box}
.shell{max-width:1320px;margin:0 auto}
.disp{font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* panels */
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--edge);position:relative;
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}
.panel.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--goldDim)}
.panel-h{font-family:var(--f-display);letter-spacing:.09em;text-transform:uppercase;font-size:13px;color:var(--gold2)}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--edge2),transparent);border:0;margin:0}

/* buttons */
button.btn{font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase;font-size:14px;padding:10px 18px;cursor:pointer;border:1px solid var(--edge2);
  background:var(--panel2);color:var(--text);transition:filter .15s, transform .1s, border-color .15s;
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
button.btn:hover:not(:disabled){filter:brightness(1.18);border-color:var(--gold)}
button.btn:active:not(:disabled){transform:translateY(1px)}
button.btn:disabled{opacity:.4;cursor:not-allowed}
button.btn:focus-visible,button.seg-b:focus-visible,.card:focus-visible,.tierb:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
button.btn.gold{background:linear-gradient(180deg,#f0be57,#c68b22);color:#1a1204;border-color:#ffd57a;font-weight:600}
button.btn.sm{padding:6px 12px;font-size:12px}
button.btn.danger:hover:not(:disabled){border-color:var(--red);color:#ffb3b5}

/* segmented control */
.seg{display:inline-flex;border:1px solid var(--edge2);background:var(--bg2)}
button.seg-b{font-family:var(--f-display);letter-spacing:.07em;text-transform:uppercase;font-size:12px;padding:6px 12px;cursor:pointer;color:var(--muted);background:transparent;border:0}
button.seg-b.on{background:var(--gold);color:#1a1204;font-weight:600}
button.seg-b:not(.on):hover{color:var(--text)}

input.fld{background:var(--bg2);border:1px solid var(--edge2);color:var(--text);padding:9px 12px;font-family:var(--f-body);font-size:14px;width:100%;outline:none}
input.fld:focus{border-color:var(--gold)}
input[type=range]{accent-color:var(--gold);width:100%}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border:1px solid var(--edge2);font-size:12px;background:var(--bg2);color:var(--muted)}
.chip.ok{border-color:var(--teal);color:var(--teal)}
.chip.gold{border-color:var(--gold);color:var(--gold2)}
.tchip{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 8px;font-family:var(--f-display);font-size:12px;letter-spacing:.05em;border:1px solid currentColor;color:var(--tc);background:rgba(255,255,255,.03)}
.soul{color:var(--soul)}

/* cards */
.card{position:relative;width:var(--cw);aspect-ratio:3/4;perspective:800px;cursor:pointer;flex:none;transition:transform .2s, filter .2s,opacity .2s;-webkit-tap-highlight-color:transparent}
.sz-s{--cw:78px}.sz-g{--cw:100px}.sz-t{--cw:120px}
@media (max-width:640px){.sz-g{--cw:84px}.sz-t{--cw:92px}.sz-s{--cw:70px}}
.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.75,.2,1)}
.card.is-back .card-inner{transform:rotateY(180deg)}
.face,.back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px),0 9px)}
.face{background:linear-gradient(160deg,var(--tc),color-mix(in srgb,var(--tc) 35%,#000))}
.face-in,.back-in{position:absolute;inset:2px;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
.face-in{background:radial-gradient(120% 80% at 50% 38%,color-mix(in srgb,var(--tc) 22%,#10141c),#0c0f15 75%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--cw)*.07) calc(var(--cw)*.05) calc(var(--cw)*.06)}
.c-top{display:flex;justify-content:space-between;width:100%;font-size:calc(var(--cw)*.105);color:var(--tc);font-family:var(--f-display);letter-spacing:.03em}
.c-top .pips{letter-spacing:-1px}
.c-top i{font-style:normal;color:var(--soul);margin-right:2px}
.c-img{font-size:calc(var(--cw)*.42);line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.55))}
.c-name{font-size:calc(var(--cw)*.112);line-height:1.15;text-align:center;font-weight:600;min-height:2.3em;display:flex;align-items:center;justify-content:center;
  overflow:hidden;word-break:break-word}
.c-info{position:absolute;right:calc(var(--cw)*.07);bottom:calc(var(--cw)*.30);width:18px;height:18px;border-radius:50%;border:1px solid var(--edge2);background:#0c0f15;color:var(--muted);
  font-size:11px;line-height:16px;padding:0;cursor:pointer;opacity:0;transition:opacity .15s}
.card:hover .c-info,.c-info:focus-visible{opacity:1}
@media (hover:none){.c-info{opacity:.85}}
.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--gold),var(--goldDim))}
.back-in{background:repeating-linear-gradient(45deg,#10131a 0 7px,#141926 7px 14px);display:flex;align-items:center;justify-content:center}
.back-in span{width:calc(var(--cw)*.42);height:calc(var(--cw)*.42);transform:rotate(45deg);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:calc(var(--cw)*.18);background:rgba(226,171,61,.08)}
.back-in span i{transform:rotate(-45deg);font-style:normal}
.back-in b{position:absolute;left:8px;top:6px;font-family:var(--f-display);color:var(--gold2);font-size:calc(var(--cw)*.14)}
.card.pickable:hover .card-inner{transform:translateY(-6px) rotateY(180deg)}
.card.pickable{filter:drop-shadow(0 0 10px rgba(226,171,61,.45))}
.card.pickable.is-back:hover{filter:drop-shadow(0 0 16px rgba(255,213,122,.8))}
.card.sel{transform:translateY(-6px);filter:drop-shadow(0 0 12px rgba(255,213,122,.7))}
.card.banned{opacity:.34;filter:grayscale(.75);cursor:not-allowed}
.card.faded{opacity:.5;filter:saturate(.5)}
.card.taken{filter:drop-shadow(0 0 12px rgba(67,192,176,.65))}
.tag{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);white-space:nowrap;font-family:var(--f-display);letter-spacing:.08em;font-size:11px;padding:1px 8px;pointer-events:none;
  background:var(--gold);color:#1a1204;z-index:2}
.tag-banned{background:#2a2f3b;color:#b9c0cf;border:1px solid var(--edge2)}
.tag-taken{background:var(--teal);color:#06201c}

/* inventory */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
@media (min-width:480px){.slots{grid-template-columns:repeat(4,1fr)}}
.slot{aspect-ratio:1;position:relative;border:1px dashed var(--edge);background:rgba(255,255,255,.015);display:flex;align-items:center;justify-content:center;color:var(--edge2);font-family:var(--f-display);font-size:12px}
.slot.full{border:1px solid var(--tc);border-style:solid;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--tc) 24%,#10141c),#0c0f15);cursor:help;
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
.slot.full .e{font-size:clamp(22px,3.2vw,32px);line-height:1}
.slot.full .p{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;color:var(--tc);font-family:var(--f-display)}
.slot.new{box-shadow:0 0 0 2px var(--teal),0 0 14px rgba(67,192,176,.55);animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

/* tooltip, modal */
.tip{position:fixed;z-index:60;width:280px;pointer-events:none;background:#0d1118;border:1px solid var(--gold);padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(3,5,8,.78);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:min(420px,100%);background:var(--panel);border:1px solid var(--gold);padding:20px;position:relative}
.stat-line{display:flex;gap:8px;align-items:baseline}
.stat-line b{color:var(--teal);font-weight:600;min-width:52px;font-variant-numeric:tabular-nums}

.stepper{display:flex;gap:0;flex-wrap:wrap}
.step{flex:1;min-width:92px;text-align:center;padding:6px 4px;font-family:var(--f-display);letter-spacing:.07em;text-transform:uppercase;font-size:12px;color:var(--muted);border-bottom:2px solid var(--edge)}
.step.on{color:var(--gold2);border-color:var(--gold)}
.step.done{color:var(--teal);border-color:var(--teal)}
.pbar{display:flex;gap:3px}
.pbar i{flex:1;height:5px;background:var(--edge)}
.pbar i.done{background:var(--teal)}.pbar i.cur{background:var(--gold)}
.tierb{cursor:pointer;border:1px solid var(--edge2);background:var(--bg2);color:var(--text);padding:8px 10px;text-align:left;min-width:108px;font-family:var(--f-body)}
.tierb.on{border-color:var(--tc);box-shadow:inset 0 0 0 1px var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--bg2))}
.tierb:disabled{opacity:.35;cursor:not-allowed}
.trayslot{width:64px;aspect-ratio:3/4;border:1px dashed var(--edge2);display:flex;align-items:center;justify-content:center;color:var(--edge2);font-family:var(--f-display);cursor:pointer;position:relative;flex:none;
  background:rgba(255,255,255,.015)}
.trayslot.f{border:1px solid var(--tc);border-style:solid;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--tc) 22%,#10141c),#0c0f15);font-size:28px;color:var(--text)}
.trayslot.f small{position:absolute;bottom:2px;font-size:9px;color:var(--tc);font-family:var(--f-display)}
.winner{background:linear-gradient(90deg,transparent,rgba(226,171,61,.16),transparent)}
table.rt{width:100%;border-collapse:collapse;font-size:13px}
table.rt th{font-family:var(--f-display);font-weight:500;letter-spacing:.07em;text-transform:uppercase;font-size:11px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--edge)}
table.rt td{padding:6px 8px;border-bottom:1px solid rgba(40,48,66,.6)}
@media (prefers-reduced-motion:reduce){.card-inner,.card,.slot.new{transition:none;animation:none}}
</style>
</head>
<body>
