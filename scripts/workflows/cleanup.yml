name: Cleanup old rooms

on:
  schedule:
    - cron: '17 3 * * *'        # каждый день в 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Пробный запуск: только показать, что удалилось бы'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin@12.7.0 --no-save
      - run: node scripts/cleanup.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
